<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="الـ HydratedCubit وقت الإنشاء بيقرا من الـ storage بشكل sync ويحوّل بالـ fromJson، ولو رمى الخطأ بيروح للـ onError، ومع كل emit الـ onChange بينادي toJson ويكتب في الـ storage"><text x="380" y="22" text-anchor="middle" font-size="11.5" fill="var(--muted)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">وقت الإنشاء: sync، قبل أول frame</text><rect x="610" y="36" width="130" height="44" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="675" y="55" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">super(initial)</text><text x="675" y="71" text-anchor="middle" font-size="10" fill="var(--muted)">constructor</text><line x1="608" y1="58" x2="594" y2="58" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#mk-ink)"/><rect x="460" y="36" width="130" height="44" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="525" y="55" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">hydrate()</text><text x="525" y="71" text-anchor="middle" font-size="10" fill="var(--muted)">storage + onError</text><line x1="458" y1="58" x2="444" y2="58" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#mk-ink)"/><rect x="310" y="36" width="130" height="44" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="375" y="55" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">storage.read</text><text x="375" y="71" text-anchor="middle" font-size="10" fill="var(--muted)">storagePrefix + id</text><line x1="308" y1="58" x2="294" y2="58" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#mk-ink)"/><rect x="160" y="36" width="130" height="44" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="225" y="55" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">fromJson</text><text x="225" y="71" text-ancho