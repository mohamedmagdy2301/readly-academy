e" font-size="10" fill="var(--muted)">HydratedMixin</text><line x1="458" y1="244" x2="444" y2="244" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#mk-ink)"/><rect x="310" y="222" width="130" height="44" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="375" y="241" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">toJson(state)</text><text x="375" y="257" text-anchor="middle" font-size="10" fill="var(--muted)">null → no write</text><line x1="308" y1="244" x2="294" y2="244" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#mk-ink)"/><rect x="160" y="222" width="130" height="44" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="225" y="241" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">storage.write</text><text x="225" y="257" text-anchor="middle" font-size="10" fill="var(--muted)">async, not awaited</text><line x1="158" y1="244" x2="144" y2="244" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#mk-mut)"/><rect x="20" y="222" width="120" height="44" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="80" y="241" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">hive_ce box</text><text x="80" y="257" text-anchor="middle" font-size="10" fill="var(--muted)">on disk</text><text x="380" y="290" text-anchor="middle" font-size="10" fill="var(--muted)">the same box is read by the next app launch</text></svg>