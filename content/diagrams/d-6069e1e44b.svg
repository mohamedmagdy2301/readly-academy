cent)"/><text x="95" y="57" text-anchor="middle" font-size="20" fill="#fff" font-weight="600">D</text><text x="95" y="104" text-anchor="middle" font-size="13" fill="var(--ink)" class="ar" direction="rtl" unicode-bidi="embed" font-weight="600">عكس الاعتماد</text><text x="95" y="126" text-anchor="middle" font-size="11.5" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">الكل يعتمد على العقد</text></svg>