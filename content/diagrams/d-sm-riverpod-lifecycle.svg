<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="دورة حياة provider بـ autoDispose: أول watch بيشغّل build، وآخر listener يمشي يتعمل dispose، وأي watch بعدها يبني من الأول، والـ invalidate أو تغيير dependency بيعيد الـ build. وتحتها الـ Cubit: create وبعدين نفس الـ object لحد close"><text x="16" y="44" font-size="11" fill="var(--accent)" font-weight="600">Riverpod · autoDispose</text><text x="355" y="20" text-anchor="middle" font-size="10.5" fill="var(--accent)">ref.invalidate · a watched dependency changed → build() again</text><path d="M460 54 V28 H250 V50" fill="none" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#mk-acc)"/><rect x="16" y="54" width="96" height="44" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="64" y="80" text-anchor="middle" font-size="11" fill="var(--muted)">no state</text><line x1="112" y1="76" x2="196" y2="76" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#mk-ink)"/><text x="156" y="68" text-anchor="middle" font-size="10" fill="var(--muted)">first watch</text><rect x="200" y="54" width="100" height="44" rx="8" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><text x="250" y="80" text-anchor="middle" font-size="11.5" fill="var(--ink)" font-weight="600">build()</text><line x1="300" y1="76" x2="376" y2="76" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#mk-ink)"/><text x="340" y="68" text-anchor="middle" font-size="10" fill="var(--muted)">state set</text><rect x="380" y="54" width="160" height="44" rx="8" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><text x="460" y="80" text-anchor="middle" font-size="11" fill="var(--ink)" font-weight="600">alive · 1..n listeners</text><line x1="540" y1="76" x2="596" y2="76" stroke="var(--warn)" stroke-width="1.4" marker-end="url(#mk-warn)"/><text x="570" y="48" text-anchor="middle" font-size="10" fill="var(--warn)">last listener left</text><rect x="600" y="54" width="144" height="44" rx="8" fill="var(--surface)" stroke="var(--warn)" stroke-width="1.5"/><text x="672" y="72" text-anchor="middle" font-size="11.5" fill="var(--ink)" font-weight="600">disposed</text><text x="672" y="89" text-anchor="middle" font-size="10" fill="var(--muted)">ref.onDispose runs</text><text x="700" y="118" text-anchor="middle" font-size="10.5" fill="var(--warn)">mounted == false</text><text x="540" y="120" text-anchor="middle" font-size="10" fill="var(--muted)">keepAlive: true → never</text><path d="M640 98 V140 H250 V102" fill="none" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#mk-mut)"/><text x="445" y="156" text-anchor="middle" font-size="10.5" fill="var(--muted)">watched again later: build() runs from scratch, the old state is gone</text><text x="380" y="178" text-anchor="middle" font-size="11.5" fill="var(--ink)" class="ar" direction="rtl" unicode-bidi="embed">مع الـ codegen، الـ autoDispose هو الـ default</text><line x1="16" y1="190" x2="744" y2="190" stroke="var(--line)" stroke-width="1.2" stroke-dasharray="4 4"/><text x="16" y="210" font-size="11" fill="var(--accent)" font-weight="600">Cubit · BlocProvider(create:)</text><text x="64" y="246" text-anchor="middle" font-size="11" fill="var(--muted)">page opens</text><line x1="112" y1="242" x2="196" y2="242" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#mk-ink)"/><rect x="200" y="220" width="100" height="44" rx="8" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><text x="250" y="246" text-anchor="middle" font-size="11.5" fill="var(--ink)" font-weight="600">create()</text><line x1="300" y1="242" x2="376" y2="242" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#mk-ink)"/><rect x="380" y="220" width="160" height="44" rx="8" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><text x="460" y="246" text-anchor="middle" font-size="11" fill="var(--ink)" font-weight="600">alive · same object</text><line x1="540" y1="242" x2="596" y2="242" stroke="var(--warn)" stroke-width="1.4" marker-end="url(#mk-warn)"/><text x="570" y="214" text-anchor="middle" font-size="10" fill="var(--warn)">page unmounted</text><rect x="600" y="220" width="144" height="44" rx="8" fill="var(--surface)" stroke="var(--warn)" stroke-width="1.5"/><text x="672" y="238" text-anchor="middle" font-size="11.5" fill="var(--ink)" font-weight="600">close()</text><text x="672" y="255" text-anchor="middle" font-size="10" fill="var(--muted)">isClosed == true</text><text x="380" y="288" text-anchor="middle" font-size="11.5" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">الـ Cubit مابيتبنيش من الأول وهو عايش: نفس الـ object من الـ create لحد الـ close</text></svg>
