<svg viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="مسار الـ logs من المصادر لـ AppLogger ثم الـ console أو Sentry"><rect x="590" y="20" width="160" height="44" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="670" y="39" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">guard</text><text x="670" y="55" text-anchor="middle" font-size="10" fill="var(--muted)">Failure → warning / error</text><rect x="590" y="76" width="160" height="44" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="670" y="95" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">LoggingInterceptor</text><text x="670" y="111" text-anchor="middle" font-size="10" fill="var(--muted)">requests, secrets hidden</text><rect x="590" y="132" width="160" height="44" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="670" y="151" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">AppBlocObserver</text><text x="670" y="167" text-anchor="middle" font-size="10" fill="var(--muted)">state changes</text><rect x="590" y="208" width="160" height="44" rx="10" fill="var(--surface)" stroke="var(--warn)" stroke-width="1.5"/><text x="670" y="227" text-anchor="middle" font-size="11" fill="var(--ink)" font-weight="600">uncaught errors</text><text x="670" y="243" text-anchor="middle" font-size="10" fill="var(--muted)">FlutterError / PlatformDispatcher</text><rect x="410" y="66" width="130" height="64" rx="10" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.5"/><text x="475" y="95" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">AppLogger</text><text x="475" y="113" text-anchor="middle" font-size="10.5" fill="#e8f2fb">contract</text><line x1="588" y1="42" x2="544" y2="80" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#mk-ink)"/><line x1="588" y1="98" x2="544" y2="98" stroke="var(--ink)" stroke-width="1.6" m