<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="الكتالوج: الـ TextField بيكتب في catalogQuery مع كل حرف، وdebouncedCatalogQuery بيستنى 350ms، والشاشة بتعمل watch لـ catalogResults بالكلمة المستقرة. لما الكلمة بقت dart، الـ instance بتاع flutter اتمسح، والصفحة 3 بتاعته اللي رجعت متأخر اترمت ومادخلتش نتايج dart">
