<line x1="400" y1="260" x2="646" y2="260" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#mk-mut)"/>
<text x="255" y="282" text-anchor="middle" font-size="12" fill="var(--good)" font-weight="600">201 replayed: same book, one copy</text>
<line x1="400" y1="290" x2="114" y2="290" stroke="var(--good)" stroke-width="1.6" marker-end="url(#mk-good)"/>
