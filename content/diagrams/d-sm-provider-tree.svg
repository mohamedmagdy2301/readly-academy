<svg viewBox="0 0 760 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="الـ providers في شجرة Readly: الـ app فوق كل حاجة، والـ shell فوق التابات، وصفحة الكتاب جنب صفحة المكتبة مش جواها، والـ bottom sheet بره الصفحة خالص"><rect x="16" y="14" width="728" height="372" rx="14" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="6 4"/><text x="30" y="34" font-size="11" fill="var(--accent)" font-weight="600">ReadlyApp · MultiBlocProvider: AuthCubit, SettingsCubit, SyncStatusCubit</text><rect x="32" y="46" width="696" height="326" rx="12" fill="none" stroke="var(--line)" stroke-width="1.5"/><text x="46" y="66" font-size="11" fill="var(--muted)" font-weight="600">MaterialApp.router · root Navigator</text><rect x="48" y="80" width="110" height="60" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="103" y="104" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">/login</text><text x="103" y="124" text-anchor="middle" font-size="10.5" fill="var(--muted)">LoginCubit</text><rect x="172" y="80" width="400" height="280" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5"/><text x="186" y="100" font-size="11" fill="var(--accent)" font-weight="600">HomeShell · BlocProvider: ProfileCubit</text><rect x="186" y="112" width="372" height="236" rx="8" fill="none" stroke="var(--line)" stroke-width="1.4" stroke-dasharray="4 3"/><text x="198" y="130" font-size="11" fill="var(--muted)" font-weight="600">branch /library · its own Navigator</text><rect x="198" y="142" width="168" height="132" rx="8" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><text x="282" y="164" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">LibraryPage</text><text x="282" y="186" text-anchor="middle" font-size="10.5" fill="var(--muted)">BlocProvider:</text><text x="282" y="203" text-anchor="middle" font-size="11" fill="var(--ink)" font-weight="600">LibraryCubit</text><text x="282" y="236" text-anchor="middle" font-size="10.5" fill="var(--accent)">read&lt;ProfileCubit&gt;() OK</text><text x="282" y="254" text-anchor="middle" font-size="10.5" fill="var(--accent)">read&lt;AuthCubit&gt;() OK</text><rect x="378" y="142" width="168" height="132" rx="8" fill="var(--surface)" stroke="var(--warn)" stroke-width="1.5"/><text x="462" y="164" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">BookPage (push)</text><text x="462" y="186" text-anchor="middle" font-size="10.5" fill="var(--ink)">BookDetailsCubit</text><text x="462" y="203" text-anchor="middle" font-size="10.5" fill="var(--ink)">NotesCubit</text><text x="462" y="236" text-anchor="middle" font-size="10.5" fill="var(--warn)" font-weight="600">read&lt;LibraryCubit&gt;()</text><text x="462" y="254" text-anchor="middle" font-size="10.5" fill="var(--warn)" font-weight="600">ProviderNotFound</text><text x="372" y="302" text-anchor="middle" font-size="11.5" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">الصفحتين جنب بعض في الـ stack، مش واحدة جوه التانية</text><text x="372" y="326" text-anchor="middle" font-size="10.5" fill="var(--muted)">route nesting in the URL is not widget nesting</text><rect x="586" y="80" width="126" height="150" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="649" y="104" text-anchor="middle" font-size="11.5" fill="var(--ink)" font-weight="600">bottom sheet</text><text x="649" y="122" text-anchor="middle" font-size="11.5" fill="var(--ink)" font-weight="600">dialog</text><text x="649" y="150" text-anchor="middle" font-size="10.5" fill="var(--muted)">a new route,</text><text x="649" y="166" text-anchor="middle" font-size="10.5" fill="var(--muted)">outside the page</text><text x="649" y="196" text-anchor="middle" font-size="10" fill="var(--accent)" font-weight="600">BlocProvider.value</text><text x="649" y="212" text-anchor="middle" font-size="10" fill="var(--accent)" font-weight="600">(context.read&lt;X&gt;())</text><text x="649" y="262" text-anchor="middle" font-size="10.5" fill="var(--muted)">root-level pages</text><text x="649" y="278" text-anchor="middle" font-size="10.5" fill="var(--muted)">see the app scope only</text><text x="380" y="408" text-anchor="middle" font-size="12" fill="var(--ink)" class="ar" direction="rtl" unicode-bidi="embed">الـ widget بيلاقي الـ provider لو كان جوه الصندوق بتاعه. اللي جنبه، أو في route تاني، مش هيلاقيه</text></svg>