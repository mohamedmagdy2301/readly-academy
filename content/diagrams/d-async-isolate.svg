<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Isolate.run: الـ main isolate بيبعت نسخة من الـ bytes لـ isolate جديد بذاكرته، والـ isolate بيعمل parse ويرجّع النتيجة ويموت، والـ main فاضي يرسم frames">
<rect x="20" y="20" width="330" height="280" rx="14" fill="none" stroke="var(--accent)" stroke-width="1.5"/>
<text x="185" y="44" text-anchor="middle" font-size="14" fill="var(--ink)" font-weight="600">main isolate</text>
<text x="185" y="62" text-anchor="middle" font-size="10" fill="var(--muted)">its own memory · its own event loop · draws the UI</text>
<rect x="410" y="20" width="330" height="280" rx="14" fill="none" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="575" y="44" text-anchor="middle" font-size="14" fill="var(--ink)" font-weight="600">Isolate.run(...)</text>
<text x="575" y="62" text-anchor="middle" font-size="10" fill="var(--muted)">new memory · no getIt, no plugins state, no `this`</text>
<rect x="50" y="84" width="270" height="40" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<text x="185" y="109" text-anchor="middle" font-size="12" fill="var(--ink)">dio: 4MB of bytes</text>
<rect x="440" y="134" width="270" height="56" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.4"/>
<text x="575" y="157" text-anchor="middle" font-size="12" fill="var(--ink)">jsonDecode + fromJson × 3000</text>
<text x="575" y="176" text-anchor="middle" font-size="10" fill="var(--muted)">~400ms of CPU, on another core</text>
<path d="M 322 104 C 380 104, 400 130, 436 150" fill="none" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#mk-acc)"/>
<text x="380" y="98" text-anchor="middle" font-size="10" fill="var(--accent)" class="ar" direction="rtl">نسخة</text>
<path d="M 436 176 C 400 210, 380 236, 322 244" fill="none" stroke="var(--good)" stroke-width="1.8" marker-end="url(#mk-good)"/>
<text x="384" y="226" text-anchor="middle" font-size="10" fill="var(--good)" class="ar" direction="rtl">النتيجة</text>
<text x="384" y="240" text-anchor="middle" font-size="9" fill="var(--muted)">(moved, no copy)</text>
<rect x="50" y="224" width="270" height="40" rx="8" fill="var(--surface)" stroke="var(--good)" stroke-width="1.4"/>
<text x="185" y="249" text-anchor="middle" font-size="12" fill="var(--ink)">await → List&lt;BookDto&gt;</text>
<g fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1">
<rect x="60" y="148" width="22" height="22" rx="3"/><rect x="88" y="148" width="22" height="22" rx="3"/><rect x="116" y="148" width="22" height="22" rx="3"/><rect x="144" y="148" width="22" height="22" rx="3"/><rect x="172" y="148" width="22" height="22" rx="3"/><rect x="200" y="148" width="22" height="22" rx="3"/><rect x="228" y="148" width="22" height="22" rx="3"/><rect x="256" y="148" width="22" height="22" rx="3"/><rect x="284" y="148" width="22" height="22" rx="3"/>
</g>
<text x="185" y="192" text-anchor="middle" font-size="11" fill="var(--ink)" class="ar" direction="rtl">الـ frames مكمّلة كل 16ms والـ spinner بيلف</text>
<text x="575" y="232" text-anchor="middle" font-size="11" fill="var(--ink)" class="ar" direction="rtl">بيخلص، يرجّع النتيجة، ويموت</text>
<text x="575" y="252" text-anchor="middle" font-size="11" fill="var(--ink)" class="ar" direction="rtl">ولو رمى، الخطأ بيترمي عند الـ await</text>
</svg>
