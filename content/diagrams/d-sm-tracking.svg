<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="طريقتين الـ UI بتعرف بيهم إن الـ state اتغيرت: اشتراك صريح في الـ Cubit والـ Bloc والـ Redux، الـ builder بيسمع على stream الـ state كلها وانت اللي بتضيّق بـ buildWhen وBlocSelector. وتتبع تلقائي في GetX وMobX وsignals، الـ builder بيشتغل جوه tracking context وكل قيمة بيقراها بتتسجل dependency، والقرايات برا الـ builder مابتتسجلش"><text x="570" y="26" text-anchor="middle" font-size="12.5" fill="var(--ink)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">اشتراك صريح: Cubit وBloc وRedux</text><rect x="400" y="40" width="340" height="44" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="570" y="58" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">emit(newState) / dispatch(action)</text><text x="570" y="75" text-anchor="middle" font-size="10.5" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">بتقول: دي state جديدة كاملة</text><line x1="570" y1="84" x2="570" y2="100" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#mk-ink)"/><rect x="400" y="102" width="340" height="44" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="570" y="120" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">stream</text><text x="570" y="137" text-anchor="middle" font-size="10.5" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">كل اللي سامعين بيستلموا الـ state كلها</text><line x1="570" y1="146" x2="570" y2="162" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#mk-ink)"/><rect x="400" y="164" width="340" height="44" rx="9" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.5"/><text x="570" y="182" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">BlocBuilder / StoreConnector</text><text x="570" y="199" text-anchor="middle" font-size="10.5" fill="#fff" class="ar" direction="rtl" unicode-bidi="embed">الاشتراك مكتوب في الكود: انت شايفه</text><line x1="570" y1="208" x2="570" y2="224" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#mk-ink)"/><rect x="400" y="226" width="340" height="50" rx="9" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><text x="570" y="246" text-anchor="middle" font-size="11.5" fill="var(--ink)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">التضييق بإيدك: buildWhen وBlocSelector</text><text x="570" y="264" text-anchor="middle" font-size="10.5" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">لو نسيته: rebuild زيادة، مش شاشة واقفة</text><line x1="385" y1="16" x2="385" y2="286" stroke="var(--line)" stroke-width="1.2" stroke-dasharray="4 4"/><text x="195" y="26" text-anchor="middle" font-size="12.5" fill="var(--ink)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">تتبع تلقائي: Obx وObserver وSignalBuilder</text><rect x="20" y="40" width="350" height="44" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="195" y="58" text-anchor="middle" font-size="11.5" fill="var(--ink)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">1. الـ builder بيشتغل جوه tracking context</text><text x="195" y="75" text-anchor="middle" font-size="10.5" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">الـ framework بيسجّل كل حاجة بتتقري</text><line x1="195" y1="84" x2="195" y2="100" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#mk-ink)"/><rect x="20" y="102" width="350" height="44" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="195" y="120" text-anchor="middle" font-size="11.5" fill="var(--ink)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">2. كل قيمة بتتقري بتبقى dependency</text><text x="195" y="137" text-anchor="middle" font-size="10.5" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">pages.value، store.books، goal.canIncrease</text><line x1="195" y1="146" x2="195" y2="162" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#mk-ink)"/><rect x="20" y="164" width="350" height="44" rx="9" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.5"/><text x="195" y="182" text-anchor="middle" font-size="11.5" fill="#fff" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">3. كتابة جديدة: اللي قروها بس بيتبنوا</text><text x="195" y="199" text-anchor="middle" font-size="10.5" fill="#fff" class="ar" direction="rtl" unicode-bidi="embed">الاشتراك مش مكتوب: بيتحسب وقت الـ build</text><line x1="195" y1="208" x2="195" y2="224" stroke="var(--warn)" stroke-width="1.3" marker-end="url(#mk-warn)"/><rect x="20" y="226" width="350" height="50" rx="9" fill="var(--surface)" stroke="var(--warn)" stroke-width="1.5"/><text x="195" y="246" text-anchor="middle" font-size="11.5" fill="var(--warn)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">قراية برا الـ builder مابتتسجّلش</text><text x="195" y="264" text-anchor="middle" font-size="10.5" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">قبله، أو في callback، أو بعد await، أو في itemBuilder</text></svg>
