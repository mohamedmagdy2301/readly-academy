<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="نفس التعديل من التابلت في خمس طرق: الـ polling بيعرف في اللفة الجاية، والـ long polling والـ SSE والـ WebSocket بيعرفوا على طول، والـ push بيصحّي الـ app">
<line x1="150" y1="22" x2="742" y2="22" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#mk-mut)"/>
<text x="742" y="40" text-anchor="end" font-size="11" fill="var(--muted)">time</text>
<line x1="420" y1="30" x2="420" y2="350" stroke="var(--warn)" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="420" y="366" text-anchor="middle" font-size="11" fill="var(--warn)" font-weight="600">edit on the tablet</text>

<text x="12" y="78" font-size="12" fill="var(--ink)" font-weight="600">Polling</text>
<line x1="150" y1="74" x2="742" y2="74" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/>
<rect x="190" y="64" width="34" height="20" rx="5" fill="var(--surface)" stroke="var(--muted)"/>
<text x="207" y="78" text-anchor="middle" font-size="10" fill="var(--muted)">304</text>
<rect x="330" y="64" width="34" height="20" rx="5" fill="var(--surface)" stroke="var(--muted)"/>
<text x="347" y="78" text-anchor="middle" font-size="10" fill="var(--muted)">304</text>
<rect x="590" y="64" width="34" height="20" rx="5" fill="var(--accent)"/>
<text x="607" y="78" text-anchor="middle" font-size="10" fill="var(--surface)">200</text>
<line x1="422" y1="96" x2="588" y2="96" stroke="var(--warn)" stroke-width="1.4"/>
<line x1="422" y1="91" x2="422" y2="101" stroke="var(--warn)" stroke-width="1.4"/>
<line x1="588" y1="91" x2="588" y2="101" stroke="var(--warn)" stroke-width="1.4"/>
<text x="505" y="110" text-anchor="middle" font-size="10" fill="var(--warn)">delay: up to one interval</text>

<text x="12" y="146" font-size="12" fill="var(--ink)" font-weight="600">Long polling</text>
<line x1="150" y1="142" x2="742" y2="142" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/>
<rect x="160" y="134" width="256" height="16" rx="5" fill="var(--accent-soft)" stroke="var(--accent)"/>
<text x="288" y="146" text-anchor="middle" font-size="10" fill="var(--ink)">GET ?since=1042&amp;wait=25 (held)</text>
<rect x="430" y="134" width="300" height="16" rx="5" fill="var(--accent-soft)" stroke="var(--accent)"/>
<text x="580" y="146" text-anchor="middle" font-size="10" fill="var(--ink)">next request, held again</text>
<circle cx="420" cy="142" r="5" fill="var(--accent)"/>

<text x="12" y="210" font-size="12" fill="var(--ink)" font-weight="600">SSE</text>
<line x1="150" y1="206" x2="742" y2="206" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/>
<rect x="160" y="198" width="570" height="16" rx="5" fill="var(--accent-soft)" stroke="var(--accent)"/>
<text x="250" y="210" text-anchor="middle" font-size="10" fill="var(--ink)">one response that never ends</text>
<line x1="420" y1="180" x2="420" y2="194" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#mk-acc)"/>
<text x="428" y="186" font-size="10" fill="var(--accent)">id: 1043</text>

<text x="12" y="274" font-size="12" fill="var(--ink)" font-weight="600">WebSocket</text>
<line x1="150" y1="270" x2="742" y2="270" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/>
<rect x="160" y="262" width="570" height="16" rx="5" fill="var(--good-soft)" stroke="var(--good)"/>
<text x="250" y="274" text-anchor="middle" font-size="10" fill="var(--ink)">101, then frames both ways</text>
<line x1="420" y1="244" x2="420" y2="258" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#mk-acc)"/>
<text x="428" y="250" font-size="10" fill="var(--accent)">book.upserted</text>
<line x1="330" y1="296" x2="330" y2="282" stroke="var(--good)" stroke-width="1.8" marker-end="url(#mk-good)"/>
<text x="336" y="300" font-size="10" fill="var(--good)">app → server</text>

<text x="12" y="334" font-size="12" fill="var(--ink)" font-weight="600">Push</text>
<line x1="150" y1="330" x2="742" y2="330" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/>
<rect x="160" y="322" width="250" height="16" rx="5" fill="none" stroke="var(--muted)" stroke-dasharray="4 3"/>
<text x="285" y="334" text-anchor="middle" font-size="10" fill="var(--muted)">app suspended: no connection</text>
<rect x="430" y="322" width="200" height="16" rx="5" fill="var(--accent)"/>
<text x="530" y="334" text-anchor="middle" font-size="10" fill="var(--surface)">OS wakes the app → GET</text>
</svg>
