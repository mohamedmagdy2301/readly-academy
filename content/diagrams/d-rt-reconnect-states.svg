<svg viewBox="0 0 760 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="حالات الاتصال: stopped وconnecting وconnected وwaiting، والـ close code بيقرر يستنى ولا يجدد الـ token ولا يبطّل، والـ pause والـ logout بيوقفوه من أي حالة">
<rect x="20" y="140" width="120" height="50" rx="12" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.6"/>
<text x="80" y="170" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">stopped</text>

<rect x="220" y="140" width="130" height="50" rx="12" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.6"/>
<text x="285" y="170" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">connecting</text>

<rect x="440" y="140" width="130" height="50" rx="12" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.6"/>
<text x="505" y="170" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">connected</text>

<rect x="330" y="262" width="130" height="50" rx="12" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.6"/>
<text x="395" y="292" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">waiting</text>

<rect x="440" y="30" width="130" height="44" rx="12" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="5 3"/>
<text x="505" y="57" text-anchor="middle" font-size="12" fill="var(--ink)">refresh token</text>

<line x1="142" y1="158" x2="216" y2="158" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#mk-ink)"/>
<text x="179" y="150" text-anchor="middle" font-size="10" fill="var(--muted)">start()</text>

<line x1="352" y1="165" x2="436" y2="165" stroke="var(--good)" stroke-width="1.6" marker-end="url(#mk-good)"/>
<text x="394" y="157" text-anchor="middle" font-size="10" fill="var(--good)">hello</text>

<line x1="290" y1="192" x2="360" y2="258" stroke="var(--warn)" stroke-width="1.6" marker-end="url(#mk-warn)"/>
<text x="282" y="236" text-anchor="end" font-size="10" fill="var(--warn)">upgrade failed</text>

<line x1="500" y1="192" x2="430" y2="258" stroke="var(--warn)" stroke-width="1.6" marker-end="url(#mk-warn)"/>
<text x="545" y="230" text-anchor="start" font-size="10" fill="var(--warn)">null · 1001 · 1011 · 4429</text>
<text x="545" y="244" text-anchor="start" font-size="10" fill="var(--muted)">ping timeout → 1001</text>

<line x1="350" y1="276" x2="300" y2="196" stroke="var(--accent)" stroke-width="1.6" marker-end="url(#mk-acc)"/>
<text x="262" y="300" text-anchor="middle" font-size="10" fill="var(--accent)">timer (backoff + jitter)</text>
<text x="262" y="314" text-anchor="middle" font-size="10" fill="var(--accent)">or onOnline</text>

<line x1="530" y1="138" x2="530" y2="78" stroke="var(--accent)" stroke-width="1.6" marker-end="url(#mk-acc)"/>
<text x="538" y="112" font-size="10" fill="var(--accent)">4401</text>
<path d="M 440 52 C 330 52, 290 90, 287 136" fill="none" stroke="var(--good)" stroke-width="1.6" marker-end="url(#mk-good)"/>
<text x="282" y="100" text-anchor="end" font-size="10" fill="var(--good)">new token</text>
<path d="M 440 44 C 200 30, 90 70, 82 136" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#mk-mut)"/>
<text x="170" y="44" text-anchor="middle" font-size="10" fill="var(--muted)">rejected / 4401 again</text>

<path d="M 572 165 C 752 165, 752 330, 80 330 L 80 194" fill="none" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#mk-mut)"/>
<text x="560" y="322" text-anchor="middle" font-size="10" fill="var(--muted)">4403 · 4426 · pause · logout</text>
</svg>
