<svg viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="قفل البصمة طبقة جوه حالة Authenticated: Unlocked وLocked، والخروج من Locked بالبصمة أو بالـ logout">
<rect x="20" y="105" width="160" height="56" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
<text x="100" y="129" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">Unauthenticated</text>
<text x="100" y="148" text-anchor="middle" font-size="11" fill="var(--muted)">/login</text>
<rect x="250" y="20" width="490" height="230" rx="14" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="495" y="44" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">Authenticated (the session: tokens in secure storage)</text>
<text x="495" y="62" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">القفل بيسأل: اللي ماسك الموبايل هو صاحبه؟ والسيرفر مالوش دعوة</text>
<rect x="285" y="105" width="160" height="56" rx="10" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.5"/>
<text x="365" y="129" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">Unlocked</text>
<text x="365" y="148" text-anchor="middle" font-size="11" fill="#e8f2fb">/library ...</text>
<rect x="560" y="105" width="160" height="56" rx="10" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="640" y="129" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">Locked</text>
<text x="640" y="148" text-anchor="middle" font-size="11" fill="var(--muted)">/unlock?from=...</text>
<line x1="447" y1="120" x2="556" y2="120" stroke="var(--warn)" stroke-width="1.6" marker-end="url(#mk-warn)"/>
<text x="502" y="98" text-anchor="middle" font-size="11" fill="var(--warn)" class="ar" direction="rtl" unicode-bidi="embed">في الخلفية أكتر من دقيقتين</text>
<line x1="556" y1="148" x2="447" y2="148" stroke="var(--good)" stroke-width="1.6" marker-end="url(#mk-good)"/>
<text x="502" y="178" text-anchor="middle" font-size="11" fill="var(--good)" class="ar" direction="rtl" unicode-bidi="embed">بصمة أو PIN الجهاز</text>
<path d="M640 163 C640 232 140 232 100 165" fill="none" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#mk-ink)"/>
<text x="395" y="240" text-anchor="middle" font-size="11" fill="var(--ink)" class="ar" direction="rtl" unicode-bidi="embed">«ادخل بالباسورد بدل كده» = logout، والـ AppLockStore بيتمسح</text>
<line x1="182" y1="122" x2="282" y2="122" stroke="var(--good)" stroke-width="1.6" marker-end="url(#mk-good)"/>
<text x="232" y="112" text-anchor="middle" font-size="11" fill="var(--good)">login</text>
</svg>
