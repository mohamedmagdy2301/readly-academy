<svg viewBox="0 0 760 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="الـ emit بيسأل الأول: الـ Cubit اتقفل؟ وبعدين: الـ state الجديدة بتساوي الحالية؟ لو أيوه بتتجاهل، ولو لأ بتروح للـ stream والـ BlocBuilder بيعيد الرسم"><rect x="560" y="16" width="180" height="40" rx="10" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.5"/><text x="650" y="41" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">emit(next)</text><line x1="650" y1="56" x2="650" y2="78" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#mk-ink)"/><rect x="520" y="82" width="220" height="40" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="630" y="107" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">الـ Cubit اتقفل؟ (isClosed)</text><line x1="520" y1="102" x2="424" y2="102" stroke="var(--warn)" stroke-width="1.5" marker-end="url(#mk-warn)"/><text x="472" y="95" text-anchor="middle" font-size="11" fill="var(--warn)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">أيوه</text><rect x="280" y="82" width="140" height="40" rx="10" fill="var(--surface)" stroke="var(--warn)" stroke-width="1.5"/><text x="350" y="107" text-anchor="middle" font-size="12" fill="var(--warn)" font-weight="600">throws StateError</text><line x1="630" y1="122" x2="630" y2="144" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#mk-mut)"/><text x="648" y="138" text-anchor="middle" font-size="11" fill="var(--muted)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">لأ</text><rect x="520" y="148" width="220" height="40" rx="10" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.8"/><text x="630" y="173" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">next == state ?</text><line x1="520" y1="168" x2="424" y2="168" stroke="var(--warn)" stroke-width="1.5" marker-end="url(#mk-warn)"/><text x="472" y="161" text-anchor="middle" font-size="11" fill="var(--warn)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">أيوه</text><rect x="244" y="148" width="176" height="40" rx="10" fill="var(--surface)" stroke="var(--warn)" stroke-width="1.5"/><text x="332" y="173" text-anchor="middle" font-size="12" fill="var(--warn)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">اتجاهلت: ولا rebuild</text><line x1="630" y1="188" x2="630" y2="210" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#mk-mut)"/><text x="648" y="204" text-anchor="middle" font-size="11" fill="var(--muted)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">لأ</text><rect x="520" y="214" width="220" height="40" rx="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><text x="630" y="239" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">onChange → stream.add</text><line x1="520" y1="234" x2="424" y2="234" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#mk-acc)"/><rect x="244" y="214" width="176" height="40" rx="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><text x="332" y="239" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">الـ BlocBuilder بيرسم</text><rect x="16" y="140" width="210" height="56" rx="8" fill="none" stroke="var(--warn)" stroke-width="1.2" stroke-dasharray="4 3"/><text x="121" y="162" text-anchor="middle" font-size="11" fill="var(--ink)" class="ar" direction="rtl" unicode-bidi="embed">ليست اتعدلت في مكانها:</text><text x="121" y="182" text-anchor="middle" font-size="11" fill="var(--ink)" class="ar" direction="rtl" unicode-bidi="embed">نفس الـ object، فـ == دايمًا true</text><line x1="226" y1="168" x2="240" y2="168" stroke="var(--warn)" stroke-width="1.3" marker-end="url(#mk-warn)"/><rect x="16" y="206" width="210" height="56" rx="8" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="4 3"/><text x="121" y="228" text-anchor="middle" font-size="11" fill="var(--ink)" class="ar" direction="rtl" unicode-bidi="embed">object جديد من غير ==:</text><text x="121" y="248" text-anchor="middle" font-size="11" fill="var(--ink)" class="ar" direction="rtl" unicode-bidi="embed">دايمًا مختلف، rebuild على الفاضي</text><line x1="226" y1="234" x2="240" y2="234" stroke="var(--muted)" stroke-width="1.3" marker-end="url(#mk-mut)"/><text x="380" y="282" text-anchor="middle" font-size="11.5" fill="var(--accent)" class="ar" direction="rtl" unicode-bidi="embed">الـ == بتاع الـ state هو اللي بيقرر: الشاشة تتحدث ولا لأ</text></svg>
