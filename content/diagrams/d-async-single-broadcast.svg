<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="الـ single-subscription stream بيخزّن القيم لحد أول مستمع وبيرفض التاني، والـ broadcast بيوزّع على الكل وبيرمي اللي اتبعت ومفيش حد سامع">
<text x="190" y="28" text-anchor="middle" font-size="14" fill="var(--ink)" font-weight="600">single-subscription</text>
<text x="190" y="46" text-anchor="middle" font-size="11" fill="var(--muted)">StreamController() · async* · file.openRead()</text>
<rect x="40" y="66" width="120" height="44" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
<text x="100" y="93" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">add(1), add(2)</text>
<rect x="210" y="66" width="130" height="44" rx="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
<text x="275" y="86" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">buffer [1, 2]</text>
<text x="275" y="102" text-anchor="middle" font-size="10" fill="var(--ink)" class="ar" direction="rtl">مستني أول listen</text>
<line x1="162" y1="88" x2="206" y2="88" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#mk-mut)"/>
<rect x="210" y="150" width="130" height="40" rx="10" fill="var(--surface)" stroke="var(--good)" stroke-width="1.5"/>
<text x="275" y="175" text-anchor="middle" font-size="10" fill="var(--ink)">listen #1: 1, 2, ...</text>
<line x1="275" y1="112" x2="275" y2="146" stroke="var(--good)" stroke-width="1.8" marker-end="url(#mk-good)"/>
<rect x="210" y="226" width="130" height="40" rx="10" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="275" y="251" text-anchor="middle" font-size="12" fill="var(--ink)">listen #2</text>
<text x="275" y="290" text-anchor="middle" font-size="11" fill="var(--warn)" font-weight="600">Bad state: Stream has already</text>
<text x="275" y="306" text-anchor="middle" font-size="11" fill="var(--warn)" font-weight="600">been listened to</text>
<line x1="380" y1="20" x2="380" y2="315" stroke="var(--line)" stroke-width="1.2" stroke-dasharray="5 5"/>
<text x="570" y="28" text-anchor="middle" font-size="14" fill="var(--ink)" font-weight="600">broadcast</text>
<text x="570" y="46" text-anchor="middle" font-size="11" fill="var(--muted)">StreamController.broadcast() · cubit.stream</text>
<rect x="420" y="66" width="120" height="44" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
<text x="480" y="93" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">add(1)</text>
<text x="480" y="130" text-anchor="middle" font-size="11" fill="var(--warn)" class="ar" direction="rtl">مفيش حد سامع: ضاعت</text>
<rect x="600" y="66" width="120" height="44" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
<text x="660" y="93" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">add(2)</text>
<rect x="560" y="170" width="70" height="40" rx="10" fill="var(--surface)" stroke="var(--good)" stroke-width="1.5"/>
<text x="595" y="195" text-anchor="middle" font-size="12" fill="var(--ink)">A: 2</text>
<rect x="650" y="170" width="70" height="40" rx="10" fill="var(--surface)" stroke="var(--good)" stroke-width="1.5"/>
<text x="685" y="195" text-anchor="middle" font-size="12" fill="var(--ink)">B: 2</text>
<line x1="650" y1="112" x2="603" y2="166" stroke="var(--good)" stroke-width="1.8" marker-end="url(#mk-good)"/>
<line x1="668" y1="112" x2="682" y2="166" stroke="var(--good)" stroke-width="1.8" marker-end="url(#mk-good)"/>
<text x="560" y="150" text-anchor="end" font-size="10" fill="var(--muted)">listen A, listen B</text>
<text x="570" y="250" text-anchor="middle" font-size="11" fill="var(--ink)" class="ar" direction="rtl">مستمعين كتير، وكل واحد بياخد اللي اتبعت بعد ما سمع بس</text>
<text x="570" y="270" text-anchor="middle" font-size="11" fill="var(--ink)" class="ar" direction="rtl">ومافيش buffer: اللي جه متأخر مايشوفش اللي فات</text>
</svg>
