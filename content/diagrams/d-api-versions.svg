<text x="105" y="171" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">app 1.1</text>
<text x="105" y="189" text-anchor="middle" font-size="11" fill="var(--muted)">build 120</text>
<rect x="30" y="240" width="150" height="48" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
<text x="105" y="261" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">app 1.2</text>
<text x="105" y="279" text-anchor="middle" font-size="11" fill="var(--muted)">build 131</text>
<line x1="240" y1="44" x2="240" y2="300" stroke="var(--accent)" stroke-width="1.6" stroke-dasharray="6 5"/>
<text x="240" y="30" text-anchor="middle" font-size="12" fill="var(--accent)" font-weight="600">minSupportedBuild = 120</text>
<line x1="180" y1="84" x2="236" y2="84" stroke="var(--warn)" stroke-width="1.6"/>
<line x1="228" y1="76" x2="244" y2="92" stroke="var(--warn)" stroke-width="2.2"/>
<line x1="228" y1="92" x2="244" y2="76" stroke="var(--warn)" stroke-width="2.2"/>
<line x1="246" y1="84" x2="296" y2="84" stroke="var(--warn)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mk-warn)"/>
