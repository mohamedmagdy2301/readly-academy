<text x="635" y="177" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">/v1: additive only</text>
<text x="635" y="197" text-anchor="middle" font-size="11" fill="var(--muted)">+ coverUrl (old apps ignore it)</text>
<rect x="550" y="236" width="170" height="54" rx="8" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.4"/>
<text x="635" y="257" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">/v2: breaking change</text>
<text x="635" y="277" text-anchor="middle" font-size="11" fill="var(--muted)">status: string → object</text>
<text x="380" y="334" text-anchor="middle" font-size="12" fill="var(--ink)" class="ar" direction="rtl" unicode-bidi="embed">الإضافة بتعدّي على v1، والكسر ليه v2، واللي تحت الـ minimum بيتقفل بـ 426</text>
