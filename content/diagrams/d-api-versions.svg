<text x="360" y="252" text-anchor="middle" font-size="11" fill="var(--good)" font-weight="600">GET /v2/library</text>
<line x1="180" y1="264" x2="546" y2="264" stroke="var(--accent)" stroke-width="1.6" marker-end="url(#mk-acc)"/>
<rect x="530" y="128" width="210" height="182" rx="14" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
<text x="635" y="148" text-anchor="middle" font-size="12" fill="var(--muted)">Readly API</text>
