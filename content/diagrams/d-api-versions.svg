<svg viewBox="0 0 760 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="تلات نسخ من الـ app بتكلّم backend واحد: التغيير الإضافي على v1، والتغيير اللي بيكسر على v2، والنسخة تحت الـ minimum بتتقفل">
