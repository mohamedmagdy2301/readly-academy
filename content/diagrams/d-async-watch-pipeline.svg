<svg viewBox="0 0 760 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="رحلة الـ stream بتاع المكتبة: الكتابة في drift بتصحّي الـ query، والليست بتعدّي على الـ local source والـ repository والـ use case لحد الـ Cubit والـ widget">
<g font-size="13" text-anchor="middle" fill="var(--ink)" font-weight="600">
<rect x="250" y="16" width="260" height="46" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
<text x="380" y="36">drift: SELECT * FROM books</text>
<rect x="250" y="84" width="260" height="46" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
<text x="380" y="104">LibraryLocalSource.watchBooks()</text>
<rect x="250" y="152" width="260" height="46" rx="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
<text x="380" y="172">LibraryRepository.watchLibrary()</text>
<rect x="250" y="220" width="260" height="46" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
<text x="380" y="240">WatchLibrary (use case)</text>
<rect x="250" y="288" width="260" height="46" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
<text x="380" y="308">LibraryCubit</text>
<rect x="250" y="350" width="260" height="40" rx="10" fill="var(--surface)" stroke="var(--good)" stroke-width="1.5"/>
<text x="380" y="375">BlocBuilder: BookList</text>
</g>
<g font-size="10" text-anchor="middle" fill="var(--muted)">
<text x="380" y="53">.watch(): Stream&lt;List&lt;BookRow&gt;&gt;</text>
<text x="380" y="121" font-size="8.5">Stream&lt;List&lt;BookRow&gt;&gt;, errors as CacheException</text>
<text x="380" y="189" font-size="9">.map(toEntity) + distinct: Stream&lt;List&lt;Book&gt;&gt;</text>
<text x="380" y="257">.map(filter + sort)</text>
<text x="380" y="325" font-size="8.5">listen → emit(LibraryLoaded) · cancel in close()</text>
</g>
<g stroke="var(--accent)" stroke-width="1.8" fill="none">
<line x1="380" y1="62" x2="380" y2="81" marker-end="url(#mk-acc)"/>
<line x1="380" y1="130" x2="380" y2="149" marker-end="url(#mk-acc)"/>
<line x1="380" y1="198" x2="380" y2="217" marker-end="url(#mk-acc)"/>
<line x1="380" y1="266" x2="380" y2="285" marker-end="url(#mk-acc)"/>
<line x1="380" y1="334" x2="380" y2="347" marker-end="url(#mk-acc)"/>
</g>
<rect x="560" y="140" width="180" height="70" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
<text x="650" y="162" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">addBook / refresh</text>
<text x="650" y="180" text-anchor="middle" font-size="10" fill="var(--muted)">upsert / transaction</text>
<text x="650" y="197" text-anchor="middle" font-size="10" fill="var(--ink)" class="ar" direction="rtl">مابيرجّعوش بيانات للشاشة</text>
<path d="M 650 138 C 650 70, 600 40, 514 38" fill="none" stroke="var(--warn)" stroke-width="1.8" marker-end="url(#mk-warn)"/>
<text x="660" y="88" text-anchor="start" font-size="11" fill="var(--warn)" font-weight="600" class="ar" direction="rtl">الجدول اتغير:</text>
<text x="660" y="104" text-anchor="start" font-size="11" fill="var(--warn)" class="ar" direction="rtl">الـ query يشتغل تاني</text>
<rect x="20" y="140" width="190" height="96" rx="10" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.2"/>
<text x="115" y="162" text-anchor="middle" font-size="11" fill="var(--ink)" font-weight="600" class="ar" direction="rtl">الـ cancel بيمشي لفوق</text>
<text x="115" y="182" text-anchor="middle" font-size="10" fill="var(--ink)" class="ar" direction="rtl">الشاشة اتقفلت ← close()</text>
<text x="115" y="198" text-anchor="middle" font-size="10" fill="var(--ink)" class="ar" direction="rtl">← cancel للـ subscription</text>
<text x="115" y="214" text-anchor="middle" font-size="10" fill="var(--ink)" class="ar" direction="rtl">← كل map تحتها بتتلغي</text>
<text x="115" y="230" text-anchor="middle" font-size="10" fill="var(--ink)" class="ar" direction="rtl">← drift يبطّل يراقب الـ query</text>
<path d="M 246 310 C 150 310, 115 280, 115 240" fill="none" stroke="var(--warn)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mk-warn)"/>
<path d="M 115 136 C 115 60, 180 39, 246 39" fill="none" stroke="var(--warn)" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#mk-warn)"/>
</svg>
