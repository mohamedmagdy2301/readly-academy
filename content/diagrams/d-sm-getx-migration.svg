<svg viewBox="0 0 760 262" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="نقل شاشة المكتبة من GetX لـ Cubit في 6 خطوات صغيرة: تستات للسلوك الحالي، الـ dependencies في الـ constructor، الـ UI برا الـ controller، state واحدة sealed، LibraryCubit بنفس الـ state والتستات، وBlocProvider في الصفحة ومسح الـ controller. بعد كل خطوة الـ app شغال والتستات خضرا"><rect x="520" y="30" width="220" height="64" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="630" y="55" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">1. تستات للسلوك الحالي</text><text x="630" y="75" text-anchor="middle" font-size="10.5" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">على الـ controller قبل أي تغيير</text><line x1="518" y1="62" x2="496" y2="62" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#mk-ink)"/><rect x="270" y="30" width="220" height="64" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="380" y="55" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">2. حقن الـ dependencies</text><text x="380" y="75" text-anchor="middle" font-size="10.5" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">في الـ constructor، مش Get.find</text><line x1="268" y1="62" x2="246" y2="62" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#mk-ink)"/><rect x="20" y="30" width="220" height="64" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="130" y="55" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">3. الـ UI برا الـ controller</text><text x="130" y="75" text-anchor="middle" font-size="10.5" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">مفيش Get.snackbar ولا Get.to</text><path d="M130 94 L130 112 L630 112 L630 130" fill="none" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#mk-ink)"/><rect x="520" y="134" width="220" height="64" rx="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><text x="630" y="159" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">4. state واحدة sealed</text><text x="630" y="179" text-anchor="middle" font-size="10.5" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">Rx&lt;LibraryState&gt; بدل 5 fields</text><line x1="518" y1="166" x2="496" y2="166" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#mk-ink)"/><rect x="270" y="134" width="220" height="64" rx="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><text x="380" y="159" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">5. LibraryCubit بنفس الـ state</text><text x="380" y="179" text-anchor="middle" font-size="10.5" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">نفس التستات، الـ act بس اتغير</text><line x1="268" y1="166" x2="246" y2="166" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#mk-ink)"/><rect x="20" y="134" width="220" height="64" rx="10" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.5"/><text x="130" y="159" text-anchor="middle" font-size="12" fill="#fff" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">6. BlocProvider في الصفحة</text><text x="130" y="179" text-anchor="middle" font-size="10.5" fill="#fff" class="ar" direction="rtl" unicode-bidi="embed">امسح الـ controller والـ binding</text><text x="380" y="232" text-anchor="middle" font-size="11" fill="var(--muted)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">بعد كل خطوة: الـ app شغال، والتستات خضرا، والـ PR صغير يترجع في دقايق</text><text x="380" y="250" text-anchor="middle" font-size="10.5" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">الـ routing (Get.to وGetMaterialApp) بيفضل زي ما هو لحد آخر شاشة</text></svg>
