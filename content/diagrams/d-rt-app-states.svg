<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="كل حالة للـ app ليها طريقة: الـ foreground بـ WebSocket، والخلفية والـ app مقفول بالـ push والـ workmanager، ومع كل رجوع catch-up من الـ API">
<rect x="20" y="40" width="220" height="150" rx="12" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/>
<text x="130" y="66" text-anchor="middle" font-size="14" fill="var(--ink)" font-weight="600">foreground</text>
<text x="130" y="96" text-anchor="middle" font-size="12" fill="var(--ink)">WebSocket open</text>
<text x="130" y="116" text-anchor="middle" font-size="11" fill="var(--muted)">events → drift → screen</text>
<text x="130" y="146" text-anchor="middle" font-size="11" fill="var(--muted)">fallback: Poller</text>
<text x="130" y="172" text-anchor="middle" font-size="11" fill="var(--ink)" class="ar" direction="rtl">التأخير: ثانية</text>

<rect x="270" y="40" width="220" height="150" rx="12" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
<text x="380" y="66" text-anchor="middle" font-size="14" fill="var(--ink)" font-weight="600">background</text>
<text x="380" y="96" text-anchor="middle" font-size="12" fill="var(--ink)">socket closed (1000)</text>
<text x="380" y="116" text-anchor="middle" font-size="11" fill="var(--muted)">FCM: notification / silent</text>
<text x="380" y="146" text-anchor="middle" font-size="11" fill="var(--muted)">workmanager: outbox</text>
<text x="380" y="172" text-anchor="middle" font-size="11" fill="var(--ink)" class="ar" direction="rtl">مفيش اتصال مفتوح</text>

<rect x="520" y="40" width="220" height="150" rx="12" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="630" y="66" text-anchor="middle" font-size="14" fill="var(--ink)" font-weight="600">terminated</text>
<text x="630" y="96" text-anchor="middle" font-size="12" fill="var(--ink)">no Dart running</text>
<text x="630" y="116" text-anchor="middle" font-size="11" fill="var(--muted)">FCM: OS shows it</text>
<text x="630" y="146" text-anchor="middle" font-size="11" fill="var(--muted)">tap → getInitialMessage</text>
<text x="630" y="172" text-anchor="middle" font-size="11" fill="var(--ink)" class="ar" direction="rtl">الـ OS بس اللي صاحي</text>

<line x1="242" y1="90" x2="266" y2="90" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#mk-mut)"/>
<line x1="492" y1="90" x2="516" y2="90" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#mk-mut)"/>
<path d="M 630 194 C 630 260, 130 260, 130 196" fill="none" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#mk-acc)"/>
<path d="M 380 194 C 380 230, 160 230, 150 198" fill="none" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#mk-acc)"/>
<rect x="250" y="250" width="260" height="30" rx="8" fill="var(--accent)"/>
<text x="380" y="270" text-anchor="middle" font-size="12" fill="#fff">resume: connect + catch-up (?since=)</text>
</svg>
