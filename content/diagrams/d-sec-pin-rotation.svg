<svg viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="تغيير الـ CA مع pinning: CA احتياطية في كل نسخة، وتاريخ بعده النسخة القديمة ترجع لـ HTTPS العادي، مقابل pin على الشهادة نفسها بيموت مع أول تجديد">
<line x1="170" y1="40" x2="740" y2="40" stroke="var(--line)" stroke-width="1.5"/>
<text x="170" y="28" text-anchor="middle" font-size="10.5" fill="var(--muted)">1.4 ships</text>
<line x1="170" y1="34" x2="170" y2="250" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 4"/>
<text x="370" y="28" text-anchor="middle" font-size="10.5" fill="var(--ink)" font-weight="600">backend moves to GTS (new CDN)</text>
<line x1="370" y1="34" x2="370" y2="250" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="600" y="28" text-anchor="middle" font-size="10.5" fill="var(--muted)">2027-10-01: 1.4 enforceUntil</text>
<line x1="600" y1="34" x2="600" y2="250" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 4"/>
<text x="150" y="80" text-anchor="end" font-size="11.5" fill="var(--ink)" font-weight="600">1.4</text>
<text x="150" y="95" text-anchor="end" font-size="10" fill="var(--muted)">LE + GTS (backup)</text>
<rect x="170" y="70" width="430" height="24" rx="6" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.3"/>
<text x="385" y="87" text-anchor="middle" font-size="10.5" fill="var(--ink)">pinned, still works after the move</text>
<rect x="600" y="70" width="140" height="24" rx="6" fill="var(--surface)" stroke="var(--line)" stroke-width="1.3"/>
<text x="670" y="87" text-anchor="middle" font-size="10.5" fill="var(--muted)">plain HTTPS</text>
<text x="150" y="140" text-anchor="end" font-size="11.5" fill="var(--ink)" font-weight="600">1.6</text>
<text x="150" y="155" text-anchor="end" font-size="10" fill="var(--muted)">GTS + a new backup</text>
<rect x="450" y="130" width="290" height="24" rx="6" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.3"/>
<text x="595" y="147" text-anchor="middle" font-size="10.5" fill="var(--ink)">pinned, enforceUntil moves forward</text>
<text x="150" y="200" text-anchor="end" font-size="11.5" fill="var(--warn)" font-weight="600">leaf pin</text>
<text x="150" y="215" text-anchor="end" font-size="10" fill="var(--muted)">fingerprint of the cert</text>
<rect x="170" y="190" width="90" height="24" rx="6" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.3"/>
<line x1="262" y1="202" x2="740" y2="202" stroke="var(--warn)" stroke-width="1.6" stroke-dasharray="2 5"/>
<text x="500" y="196" text-anchor="middle" font-size="11" fill="var(--warn)" class="ar" direction="rtl" unicode-bidi="embed">مات مع أول تجديد للشهادة (90 يوم أو أقل)</text>
<text x="455" y="250" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">كل نسخة فيها CA حالية وواحدة احتياطية، ومفيش نسخة بتموت: يا pinned يا HTTPS عادي</text>
</svg>
