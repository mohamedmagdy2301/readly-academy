<svg viewBox="0 0 760 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="الـ retaining path: الـ scheduler عايش طول عمر الـ app، ماسك ticker، ماسك AnimationController، ماسك الـ State، ماسك الشجرة والـ BookDetailsCubit. dispose واحد بيقطع السلسلة">
<g font-size="11" text-anchor="middle" fill="var(--ink)">
<rect x="20" y="60" width="120" height="44" rx="8" fill="var(--surface)" stroke="var(--muted)" stroke-width="1.4"/><text x="80" y="80">SchedulerBinding</text><text x="80" y="95" font-size="9" fill="var(--muted)">lives forever</text>
<rect x="170" y="60" width="90" height="44" rx="8" fill="var(--warn-soft)" stroke="var(--warn)"/><text x="215" y="86">_Ticker</text>
<rect x="290" y="60" width="140" height="44" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.6"/><text x="360" y="80">AnimationController</text><text x="360" y="95" font-size="9" fill="var(--warn)">repeat(), no dispose</text>
<rect x="460" y="60" width="120" height="44" rx="8" fill="var(--warn-soft)" stroke="var(--warn)"/><text x="520" y="86">_NoteEditorState</text>
<rect x="610" y="60" width="130" height="44" rx="8" fill="var(--warn-soft)" stroke="var(--warn)"/><text x="675" y="80">Element tree</text><text x="675" y="95" font-size="9" fill="var(--muted)">+ BookDetailsCubit</text>
</g>
<g stroke="var(--warn)" stroke-width="1.6" fill="none">
<path d="M 140 82 L 166 82" marker-end="url(#mk-warn)"/><path d="M 260 82 L 286 82" marker-end="url(#mk-warn)"/><path d="M 430 82 L 456 82" marker-end="url(#mk-warn)"/><path d="M 580 82 L 606 82" marker-end="url(#mk-warn)"/>
</g>
<path d="M 273 40 L 273 124" stroke="var(--good)" stroke-width="2" stroke-dasharray="5 4"/>
<text x="273" y="30" text-anchor="middle" font-size="11" fill="var(--good)">_saving.dispose()</text>
<text x="380" y="164" text-anchor="middle" font-size="12" fill="var(--ink)" class="ar" direction="rtl">الـ GC مايقدرش يمسح أي حاجة في السلسلة طول ما أولها عايش</text>
<text x="380" y="186" text-anchor="middle" font-size="12" fill="var(--ink)" class="ar" direction="rtl">dispose واحد بيقطعها، وكل اللي بعده بيتمسح</text>
</svg>
