<svg viewBox="0 0 760 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="timeline لـ provider: build 1 بيعمل Ref 1، وadd بتبدأ وبتمسك Ref 1، وفي النص invalidate بيعمل build 2 بـ Ref 2. لما add ترجع، ref.mounted بيقرا Ref 2 فبيقول true والكتابة بتحصل فوق state جديدة، لكن buildRef.mounted بيقرا Ref 1 فبيقول false والـ action بتقف">
<line x1="30" y1="60" x2="730" y2="60" stroke="var(--line)" stroke-width="2"/>
<text x="30" y="42" font-size="10.5" fill="var(--muted)">NotesNotifier (the same object all along)</text>
<rect x="40" y="50" width="200" height="20" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.3"/>
<text x="140" y="64" text-anchor="middle" font-size="10" fill="var(--ink)">build 1 · Ref 1</text>
<rect x="320" y="50" width="390" height="20" rx="4" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.3"/>
<text x="515" y="64" text-anchor="middle" font-size="10" fill="var(--ink)">build 2 · Ref 2</text>
<line x1="300" y1="30" x2="300" y2="190" stroke="var(--warn)" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="300" y="24" text-anchor="middle" font-size="10" fill="var(--warn)" font-weight="600">invalidate (pull-to-refresh)</text>
<rect x="150" y="100" width="410" height="22" rx="4" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.3"/>
<text x="160" y="115" font-size="10" fill="var(--ink)">add('great chapter'): final buildRef = ref (Ref 1) … await server …</text>
<line x1="560" y1="122" x2="560" y2="140" stroke="var(--ink)" stroke-width="1.3" marker-end="url(#mk-ink)"/>
<rect x="400" y="146" width="320" height="26" rx="6" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.3"/>
<text x="560" y="163" text-anchor="middle" font-size="10" fill="var(--ink)">ref.mounted → Ref 2 → true → note added twice</text>
<rect x="400" y="180" width="320" height="26" rx="6" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.3"/>
<text x="560" y="197" text-anchor="middle" font-size="10" fill="var(--ink)">buildRef.mounted → Ref 1 → false → return</text>
<text x="40" y="160" font-size="10" fill="var(--muted)">dispose (last listener left):</text>
<text x="40" y="176" font-size="10" fill="var(--muted)">both are false</text>
<text x="380" y="252" text-anchor="middle" font-size="11.5" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">الـ provider عايش، بس الـ build اللي الـ action بدأت فيه خلص</text>
</svg>
