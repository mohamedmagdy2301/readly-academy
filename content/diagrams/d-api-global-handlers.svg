<text x="120" y="157" text-anchor="middle" font-size="13" fill="var(--surface)" font-weight="600">AppLogger</text>
<text x="120" y="196" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">بيسجّل، والـ app بيكمّل</text>
<line x1="258" y1="62" x2="202" y2="138" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#mk-ink)"/>
