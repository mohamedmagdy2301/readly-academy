<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="الأخطاء اللي محدش مسكها بتروح فين: FlutterError.onError وPlatformDispatcher.onError والـ onError port بتاع الـ isolate">
<rect x="500" y="20" width="240" height="36" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<text x="620" y="43" text-anchor="middle" font-size="12" fill="var(--ink)">build / layout / paint</text>
<rect x="500" y="66" width="240" height="36" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<text x="620" y="89" text-anchor="middle" font-size="12" fill="var(--ink)">sync onPressed callback</text>
<rect x="500" y="112" width="240" height="36" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<text x="620" y="135" text-anchor="middle" font-size="12" fill="var(--ink)">Future with no await</text>
<rect x="500" y="158" width="240" height="36" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<text x="620" y="181" text-anchor="middle" font-size="12" fill="var(--ink)">listen() with no onError</text>
<rect x="500" y="204" width="240" height="36" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<text x="620" y="227" text-anchor="middle" font-size="12" fill="var(--ink)">async onPressed, after await</text>
<rect x="500" y="250" width="240" height="36" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<text x="620" y="273" text-anchor="middle" font-size="12" fill="var(--ink)">Isolate.spawn body</text>
