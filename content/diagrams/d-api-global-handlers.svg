<text x="360" y="61" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">FlutterError.onError</text>
<text x="360" y="96" text-anchor="middle" font-size="10" fill="var(--muted)">+ ErrorWidget replaces the widget</text>
<rect x="260" y="140" width="200" height="44" rx="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
<text x="360" y="167" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">PlatformDispatcher.onError</text>
