<text x="360" y="265" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">onError port</text>
<text x="360" y="281" text-anchor="middle" font-size="10" fill="var(--muted)">only if you passed one</text>
<line x1="498" y1="38" x2="464" y2="50" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#mk-ink)"/>
