<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="نفس الكتابة على 3 خطوط: الأحداث الأصلية، والـ debounce اللي بيطلّع آخر قيمة بعد السكوت، والـ throttle اللي بيطلّع أول قيمة ويقفل فترة">
<text x="20" y="40" font-size="12" fill="var(--muted)">source</text>
<text x="20" y="130" font-size="12" fill="var(--muted)">debounce 350ms</text>
<text x="20" y="220" font-size="12" fill="var(--muted)">throttle 350ms</text>
<line x1="130" y1="50" x2="740" y2="50" stroke="var(--line)" stroke-width="1.6" marker-end="url(#mk-mut)"/>
<line x1="130" y1="140" x2="740" y2="140" stroke="var(--line)" stroke-width="1.6" marker-end="url(#mk-mut)"/>
<line x1="130" y1="230" x2="740" y2="230" stroke="var(--line)" stroke-width="1.6" marker-end="url(#mk-mut)"/>
<g font-size="10" text-anchor="middle" fill="var(--ink)">
<circle cx="160" cy="50" r="13" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.4"/><text x="160" y="54">f</text>
<circle cx="200" cy="50" r="13" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.4"/><text x="200" y="54">fl</text>
<circle cx="240" cy="50" r="13" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.4"/><text x="240" y="54">flu</text>
<circle cx="440" cy="50" r="13" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.4"/><text x="440" y="54">flut</text>
<circle cx="480" cy="50" r="13" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.4"/><text x="480" y="54">flutt</text>
<circle cx="520" cy="50" r="13" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.4"/><text x="520" y="54" font-size="9">flutte</text>
<circle cx="560" cy="50" r="13" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.4"/><text x="560" y="54" font-size="8">flutter</text>
</g>
<rect x="240" y="122" width="105" height="36" fill="var(--accent-soft)" opacity="0.6"/>
<rect x="560" y="122" width="105" height="36" fill="var(--accent-soft)" opacity="0.6"/>
<circle cx="345" cy="140" r="15" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.8"/><text x="345" y="144" font-size="10" text-anchor="middle" fill="var(--ink)">flu</text>
<circle cx="665" cy="140" r="15" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.8"/><text x="665" y="144" font-size="8" text-anchor="middle" fill="var(--ink)">flutter</text>
<text x="292" y="176" text-anchor="middle" font-size="10" fill="var(--accent)" class="ar" direction="rtl">350ms سكوت</text>
<rect x="160" y="212" width="105" height="36" fill="var(--warn-soft)" opacity="0.7"/>
<rect x="440" y="212" width="105" height="36" fill="var(--warn-soft)" opacity="0.7"/>
<circle cx="160" cy="230" r="15" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.8"/><text x="160" y="234" font-size="10" text-anchor="middle" fill="var(--ink)">f</text>
<circle cx="440" cy="230" r="15" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.8"/><text x="440" y="234" font-size="10" text-anchor="middle" fill="var(--ink)">flut</text>
<circle cx="560" cy="230" r="15" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.8"/><text x="560" y="234" font-size="8" text-anchor="middle" fill="var(--ink)">flutter</text>
<text x="212" y="266" text-anchor="middle" font-size="10" fill="var(--warn)" class="ar" direction="rtl">مقفول: fl وflu اترموا</text>
<text x="380" y="290" text-anchor="middle" font-size="11" fill="var(--ink)" class="ar" direction="rtl">الـ debounce بيستنى السكوت ويطلّع الأخير. الـ throttle بيطلّع الأول ويقفل فترة.</text>
</svg>
