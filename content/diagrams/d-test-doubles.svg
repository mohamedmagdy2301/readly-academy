<svg viewBox="0 0 760 262" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="أنواع الـ test doubles الخمسة: Dummy وStub وSpy وMock وFake، وكل واحد بيختبر إيه"><line x1="740" y1="18" x2="20" y2="18" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#mk-mut)"/><text x="740" y="36" text-anchor="start" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">مابيعملش حاجة</text><text x="20" y="36" text-anchor="end" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">شغال فعلًا</text><rect x="612" y="48" width="128" height="64" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="676" y="72" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">Dummy</text><text x="676" y="94" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">بيتبعت ومحدش بيلمسه</text><rect x="464" y="48" width="128" height="64" rx="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><text x="528" y="72" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">Stub</text><text x="528" y="94" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">بيرجّع رد محفوظ</text><rect x="316" y="48" width="128" height="64" rx="10" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/><text x="380" y="72" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">Spy</text><text x="380" y="94" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">stub بيسجّل اللي جاله</text><rect x="168" y="48" width="128" height="64" rx="10" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/><text x="232" y="72" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">Mock</text><text x="232" y="94" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">متبرمج، وبتعمله verify</text><rect x="20" y="48" width="128" height="64" rx="10" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/><text x="84" y="72" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">Fake</text><text x="84" y="94" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">تنفيذ حقيقي مبسّط</text><path d="M466 128 L466 138 L590 138 L590 128" fill="none" stroke="var(--accent)" stroke-width="1.5"/><text x="528" y="158" text-anchor="middle" font-size="11" fill="var(--accent)" class="ar" direction="rtl" unicode-bidi="embed">بيغذّي الكود بـ input</text><text x="528" y="174" text-anchor="middle" font-size="10.5" fill="var(--muted)">indirect input</text><path d="M170 128 L170 138 L442 138 L442 128" fill="none" stroke="var(--warn)" stroke-width="1.5"/><text x="306" y="158" text-anchor="middle" font-size="11" fill="var(--warn)" class="ar" direction="rtl" unicode-bidi="embed">بتتشيك على التفاعل: اتنادى؟ بإيه؟ كام مرة؟</text><text x="306" y="174" text-anchor="middle" font-size="10.5" fill="var(--muted)">behavior verification</text><path d="M22 128 L22 138 L146 138 L146 128" fill="none" stroke="var(--good)" stroke-width="1.5"/><text x="84" y="158" text-anchor="middle" font-size="11" fill="var(--good)" class="ar" direction="rtl" unicode-bidi="embed">بتتشيك على النتيجة</text><text x="84" y="174" text-anchor="middle" font-size="10.5" fill="var(--muted)">state verification</text><text x="676" y="158" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">بيملا مكان بس</text><rect x="20" y="198" width="720" height="48" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="380" y="218" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">mocktail: class واحدة extends Mock بتبقى Stub أو Spy أو Mock حسب انت بتعمل إيه</text><text x="380" y="236" text-anchor="middle" font-size="11" fill="var(--muted)">when(...) = stub · verify(...) = spy / mock · extends Fake = dummy or hand-written fake</text></svg>
