<svg viewBox="0 0 760 350" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="طبقات الـ provider: ChangeNotifierProvider وProvider وBlocProvider كلهم مبنيين على InheritedProvider من package provider، واللي مبني على InheritedWidget من Flutter. الفرق بينهم مصدر التنبيه ومين بيتقفل"><text x="380" y="22" text-anchor="middle" font-size="12" fill="var(--ink)" class="ar" direction="rtl" unicode-bidi="embed" font-weight="600">الـ widgets اللي بتكتبها</text><rect x="30" y="36" width="220" height="70" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="140" y="58" text-anchor="middle" font-size="11.5" fill="var(--ink)" font-weight="600">ChangeNotifierProvider</text><text x="140" y="76" text-anchor="middle" font-size="10" fill="var(--muted)">listens: addListener</text><text x="140" y="94" text-anchor="middle" font-size="10" fill="var(--muted)">dispose: notifier.dispose()</text><rect x="270" y="36" width="220" height="70" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="380" y="58" text-anchor="middle" font-size="11.5" fill="var(--ink)" font-weight="600">Provider · RepositoryProvider</text><text x="380" y="76" text-anchor="middle" font-size="10" fill="var(--muted)">plain object, no listening</text><text x="380" y="94" text-anchor="middle" font-size="10" fill="var(--muted)">dispose: optional</text><rect x="510" y="36" width="220" height="70" rx="8" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><text x="620" y="58" text-anchor="middle" font-size="11.5" fill="var(--ink)" font-weight="600">BlocProvider</text><text x="620" y="76" text-anchor="middle" font-size="10" fill="var(--muted)">listens: bloc.stream.listen</text><text x="620" y="94" text-anchor="middle" font-size="10" fill="var(--muted)">dispose: bloc.close()</text><line x1="140" y1="107" x2="240" y2="159" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#mk-ink)"/><line x1="380" y1="107" x2="380" y2="159" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#mk-ink)"/><line x1="620" y1="107" x2="520" y2="159" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#mk-acc)"/><rect x="130" y="162" width="500" height="68" rx="8" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5"/><text x="380" y="182" text-anchor="middle" font-size="11.5" fill="var(--ink)" font-weight="600">InheritedProvider&lt;T&gt;</text><text x="380" y="200" text-anchor="middle" font-size="10" fill="var(--muted)">create (lazy) · value · dispose · startListening</text><text x="380" y="219" text-anchor="middle" font-size="10" fill="var(--accent)">+ context.read · watch · select</text><text x="692" y="200" text-anchor="middle" font-size="11" fill="var(--accent)" font-weight="600">provider</text><line x1="255" y1="231" x2="255" y2="275" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#mk-ink)"/><line x1="505" y1="231" x2="505" y2="275" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#mk-mut)"/><rect x="130" y="278" width="250" height="56" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="255" y="300" text-anchor="middle" font-size="11.5" fill="var(--ink)" font-weight="600">InheritedWidget</text><text x="255" y="320" text-anchor="middle" font-size="10" fill="var(--muted)">dependOn... · getInherited...</text><rect x="400" y="278" width="230" height="56" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="515" y="300" text-anchor="middle" font-size="11.5" fill="var(--ink)" font-weight="600">Listenable · Stream</text><text x="515" y="320" text-anchor="middle" font-size="10" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">مصدر التنبيه: Flutter وdart:async</text><text x="692" y="310" text-anchor="middle" font-size="11" fill="var(--muted)" font-weight="600">Flutter</text></svg>