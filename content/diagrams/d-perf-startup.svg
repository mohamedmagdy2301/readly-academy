<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="الـ bootstrap قبل: كل خطوة await ورا اللي قبلها ومعاها طلب شبكة، والكتب بتظهر بعد 2.9 ثانية. بعد: الحاجات المستقلة بالتوازي، والباقي بعد أول frame، والكتب بعد 1.1 ثانية">
