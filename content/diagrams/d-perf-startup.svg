<text x="380" y="124" text-anchor="middle" font-size="12" fill="var(--ink)" class="ar" direction="rtl">قبل: كل await ورا اللي قبله، وطلب شبكة بيقرر أول route، والـ DB بتتفتح بعد أول frame</text>
