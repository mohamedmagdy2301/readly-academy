<svg viewBox="0 0 760 346" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="شجرة قرار Cubit ولا Bloc: لو محتاج سجل بالـ events يبقى Bloc، لو الـ actions بتخلص قبل اللي بعدها يبقى Cubit، لو flag أو request id واحد كفاية يبقى Cubit، غير كده Bloc مع transformer لكل event"><rect x="400" y="20" width="340" height="50" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="570" y="50" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">محتاج سجل بالسبب ورا كل state؟ (audit، replay)</text><line x1="400" y1="45" x2="286" y2="45" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#mk-acc)"/><text x="343" y="38" text-anchor="middle" font-size="11" fill="var(--accent)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">أيوه</text><rect x="40" y="20" width="240" height="50" rx="9" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.5"/><text x="160" y="42" text-anchor="middle" font-size="12" fill="var(--surface)" font-weight="600">Bloc</text><text x="160" y="58" text-anchor="middle" font-size="10.5" fill="var(--surface)" class="ar" direction="rtl" unicode-bidi="embed">onEvent وonTransition</text><line x1="570" y1="70" x2="570" y2="93" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#mk-mut)"/><text x="592" y="86" text-anchor="middle" font-size="11" fill="var(--muted)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">لأ</text><rect x="400" y="96" width="340" height="50" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="570" y="126" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">كل action بتخلص قبل اللي بعدها؟ (زرار، فتح شاشة)</text><line x1="400" y1="121" x2="286" y2="121" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#mk-acc)"/><text x="343" y="114" text-anchor="middle" font-size="11" fill="var(--accent)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">أيوه</text><rect x="40" y="96" width="240" height="50" rx="9" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><text x="160" y="118" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">Cubit</text><text x="160" y="134" text-anchor="middle" font-size="10.5" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">ReadingGoal، Login، BookDetails</text><line x1="570" y1="146" x2="570" y2="169" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#mk-mut)"/><text x="592" y="162" text-anchor="middle" font-size="11" fill="var(--muted)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">لأ</text><rect x="400" y="172" width="340" height="50" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="570" y="202" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">flag أو request id واحد بيحلها بوضوح؟</text><line x1="400" y1="197" x2="286" y2="197" stroke="var(--accent)" stroke-width="1.4" marker-end="url(#mk-acc)"/><text x="343" y="190" text-anchor="middle" font-size="11" fill="var(--accent)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">أيوه</text><rect x="40" y="172" width="240" height="50" rx="9" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><text x="160" y="194" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">Cubit + نمط الوحدة 5</text><text x="160" y="210" text-anchor="middle" font-size="10.5" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">refresh، pagination بسيطة</text><line x1="570" y1="222" x2="570" y2="245" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#mk-mut)"/><text x="592" y="238" text-anchor="middle" font-size="11" fill="var(--muted)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">لأ</text><rect x="400" y="248" width="340" height="56" rx="9" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.5"/><text x="570" y="273" text-anchor="middle" font-size="12" fill="var(--surface)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">Bloc + transformer لكل event</text><text x="570" y="289" text-anchor="middle" font-size="10.5" fill="var(--surface)" class="ar" direction="rtl" unicode-bidi="embed">debounce، droppable، restartable</text><text x="570" y="330" text-anchor="middle" font-size="10.5" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">inputs أسرع من الرد، وأكتر من سياسة في نفس الشاشة: بحث، scroll، streams</text><text x="160" y="280" text-anchor="middle" font-size="11.5" fill="var(--muted)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">مش متأكد؟ ابدأ بـ Cubit:</text><text x="160" y="298" text-anchor="middle" font-size="10.5" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">النقل لـ Bloc بعدين مابيلمسش الـ states ولا الـ builders</text></svg>
