<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="هرم الاختبارات مقابل الكأس: الهرم أغلبه unit، والكأس أغلبه integration يعني widget وCubit مع fakes، وتحتهم الـ static analysis"><path d="M30 270 L350 270 L300 204 L80 204 Z" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><text x="190" y="239" text-anchor="middle" font-size="12.5" fill="var(--ink)" font-weight="600">unit</text><text x="190" y="255" text-anchor="middle" font-size="10.5" fill="var(--muted)">domain, data, Cubit</text><path d="M80 204 L300 204 L250 138 L130 138 Z" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="190" y="173" text-anchor="middle" font-size="12.5" fill="var(--ink)" font-weight="600">widget</text><text x="190" y="189" text-anchor="middle" font-size="10.5" fill="var(--muted)">one screen</text><path d="M130 138 L250 138 L200 72 L180 72 Z" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/><text x="190" y="120" text-anchor="middle" font-size="12.5" fill="var(--ink)" font-weight="600">integration</text><text x="260" y="98" text-anchor="start" font-size="10.5" fill="var(--muted)">few, critical flows</text><text x="190" y="300" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">Pyramid</text><text x="190" y="318" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">أغلب التستات صغيرة ومعزولة</text><rect x="455" y="236" width="210" height="34" rx="6" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="560" y="257" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">static: <tspan font-weight="400" fill="var(--muted)" font-size="10.5">analyzer + lints</tspan></text><rect x="505" y="186" width="110" height="50" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><text x="560" y="209" text-anchor="middle" font-size="12.5" fill="var(--ink)" font-weight="600">unit</text><text x="560" y="225" text-anchor="middle" font-size="10.5" fill="var(--muted)">pure rules</text><rect x="425" y="96" width="270" height="90" rx="14" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.5"/><text x="560" y="139" text-anchor="middle" font-size="12.5" fill="var(--surface)" font-weight="600">integration</text><text x="560" y="155" text-anchor="middle" font-size="10.5" fill="var(--accent-soft)">widget + real Cubit + fakes</text><rect x="510" y="56" width="100" height="40" rx="6" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/><text x="560" y="74" text-anchor="middle" font-size="12.5" fill="var(--ink)" font-weight="600">e2e</text><text x="560" y="90" text-anchor="middle" font-size="10.5" fill="var(--muted)">few</text><text x="560" y="300" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">Trophy</text><text x="560" y="318" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">أغلب الثقة من تستات بتجمع أجزاء حقيقية</text><line x1="380" y1="40" x2="380" y2="280" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 5"/></svg>