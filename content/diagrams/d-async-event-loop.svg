<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="الـ event loop: الكود بيخلص للآخر، وبعدين كل الـ microtasks، وبعدين event واحد بس، وترجع تاني">
<rect x="10" y="10" width="740" height="360" rx="14" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="735" y="34" text-anchor="start" font-size="12" fill="var(--muted)" class="ar" direction="rtl">main isolate: thread واحد</text>
<rect x="270" y="48" width="220" height="70" rx="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
<text x="380" y="74" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">call stack</text>
<text x="380" y="96" text-anchor="middle" font-size="12" fill="var(--ink)" class="ar" direction="rtl">بيشغّل حاجة واحدة لحد آخرها</text>
<text x="380" y="111" text-anchor="middle" font-size="10" fill="var(--muted)">main(), build(), onTap, the code until the first await</text>
<rect x="40" y="170" width="300" height="84" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
<text x="190" y="192" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">microtask queue</text>
<rect x="56" y="206" width="84" height="32" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
<text x="98" y="226" text-anchor="middle" font-size="10" fill="var(--ink)">after await</text>
<rect x="148" y="206" width="84" height="32" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
<text x="190" y="226" text-anchor="middle" font-size="10" fill="var(--ink)">.then(...)</text>
<rect x="240" y="206" width="84" height="32" rx="6" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/>
<text x="282" y="226" text-anchor="middle" font-size="10" fill="var(--ink)">scheduleMicrotask</text>
<rect x="420" y="170" width="300" height="84" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
<text x="570" y="192" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">event queue</text>
<rect x="436" y="206" width="84" height="32" rx="6" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1"/>
<text x="478" y="226" text-anchor="middle" font-size="10" fill="var(--ink)">dio response</text>
<rect x="528" y="206" width="84" height="32" rx="6" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1"/>
<text x="570" y="226" text-anchor="middle" font-size="10" fill="var(--ink)">Timer / tap</text>
<rect x="620" y="206" width="84" height="32" rx="6" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1"/>
<text x="662" y="226" text-anchor="middle" font-size="10" fill="var(--ink)">Future(() {})</text>
<path d="M 300 120 C 260 140, 230 150, 210 166" fill="none" stroke="var(--accent)" stroke-width="1.8" marker-end="url(#mk-acc)"/>
<text x="250" y="140" text-anchor="end" font-size="11" fill="var(--accent)" font-weight="600" class="ar" direction="rtl">١. الـ stack فضي</text>
<path d="M 340 212 C 380 212, 390 212, 416 212" fill="none" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#mk-mut)"/>
<text x="380" y="272" text-anchor="middle" font-size="11" fill="var(--ink)" class="ar" direction="rtl">٢. كل الـ microtasks لحد ما الطابور يفضى</text>
<text x="380" y="290" text-anchor="middle" font-size="11" fill="var(--ink)" class="ar" direction="rtl">٣. event واحد بس من الطابور التاني</text>
<path d="M 570 168 C 560 140, 520 112, 494 100" fill="none" stroke="var(--warn)" stroke-width="1.8" marker-end="url(#mk-warn)"/>
<text x="560" y="134" text-anchor="start" font-size="11" fill="var(--warn)" font-weight="600" class="ar" direction="rtl">٤. يرجع للـ stack</text>
<rect x="150" y="310" width="460" height="44" rx="10" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.2"/>
<text x="380" y="330" text-anchor="middle" font-size="11" fill="var(--ink)" class="ar" direction="rtl">والـ frame بتاع الشاشة نفسه event: لو الـ stack أو الـ microtasks</text>
<text x="380" y="346" text-anchor="middle" font-size="11" fill="var(--ink)" class="ar" direction="rtl">خدوا 200ms، الشاشة واقفة 200ms، والـ await مش هينقذك</text>
</svg>
