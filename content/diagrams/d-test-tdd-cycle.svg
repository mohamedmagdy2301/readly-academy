<svg viewBox="0 0 760 262" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="دورة الـ TDD: تست أحمر، ثم أقل كود يخليه أخضر، ثم refactor والتستات خضرا، وبعدين التست الجاي من الـ test list"><text x="120" y="30" text-anchor="middle" font-size="11" fill="var(--muted)" font-weight="600">write the spec</text><text x="380" y="30" text-anchor="middle" font-size="11" fill="var(--muted)" font-weight="600">make it work</text><text x="640" y="30" text-anchor="middle" font-size="11" fill="var(--muted)" font-weight="600">make it right</text><rect x="20" y="40" width="200" height="92" rx="12" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/><text x="120" y="66" text-anchor="middle" font-size="15" fill="var(--warn)" font-weight="700">RED</text><text x="120" y="90" text-anchor="middle" font-size="12" fill="var(--ink)" class="ar" direction="rtl" unicode-bidi="embed">اكتب تست واحد يفشل</text><text x="120" y="112" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">واتأكد إنه فشل للسبب الصح</text><rect x="280" y="40" width="200" height="92" rx="12" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/><text x="380" y="66" text-anchor="middle" font-size="15" fill="var(--good)" font-weight="700">GREEN</text><text x="380" y="90" text-anchor="middle" font-size="12" fill="var(--ink)" class="ar" direction="rtl" unicode-bidi="embed">أقل كود يخليه يعدّي</text><text x="380" y="112" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">حتى لو رجّعت رقم ثابت</text><rect x="540" y="40" width="200" height="92" rx="12" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><text x="640" y="66" text-anchor="middle" font-size="15" fill="var(--accent)" font-weight="700">REFACTOR</text><text x="640" y="90" text-anchor="middle" font-size="12" fill="var(--ink)" class="ar" direction="rtl" unicode-bidi="embed">نضّف الكود والتستات</text><text x="640" y="112" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">والتستات كلها لسه خضرا</text><line x1="222" y1="86" x2="276" y2="86" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#mk-ink)"/><line x1="482" y1="86" x2="536" y2="86" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#mk-ink)"/><path d="M640 134 V176 H120 V138" fill="none" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#mk-mut)"/><text x="380" y="196" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">التست الجاي من الـ test list</text><rect x="20" y="214" width="720" height="34" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="380" y="236" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">كل لفة دقايق. لو الأحمر طوّل، الخطوة كانت أكبر من اللازم: ارجع وخد خطوة أصغر</text></svg>
