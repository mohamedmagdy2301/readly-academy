<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Readly وقت الـ migration: الـ ProviderScope فوق كل حاجة وجواه الـ MultiBlocProvider. المكتبة والكتالوج Riverpod، والملاحظات والإضافة Cubit، والاتنين بيسمعوا على نفس الـ repositories، ومفيش سهم من Notifier لـ Cubit. والـ providers هي مالك الـ repositories، وget_it بيقرا منها لحد ما يتشال">
