<svg viewBox="0 0 760 232" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="دورة حياة الـ Cubit: الإنشاء بـ state ابتدائية، وكل emit بينادي onChange ويطلع على الـ stream، والـ state المتكررة بتتجاهل، وبعد close أي emit بيرمي StateError"><rect x="10" y="36" width="114" height="46" rx="9" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><text x="67" y="56" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">create</text><text x="67" y="72" text-anchor="middle" font-size="10" fill="var(--muted)">super(20)</text><rect x="136" y="36" width="114" height="46" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="193" y="56" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">emit(25)</text><text x="193" y="72" text-anchor="middle" font-size="10" fill="var(--muted)">state = 25</text><rect x="262" y="36" width="114" height="46" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="319" y="56" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">emit(30)</text><text x="319" y="72" text-anchor="middle" font-size="10" fill="var(--muted)">state = 30</text><rect x="388" y="36" width="114" height="46" rx="9" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3"/><text x="445" y="56" text-anchor="middle" font-size="12" fill="var(--muted)" font-weight="600">emit(30)</text><text x="445" y="72" text-anchor="middle" font-size="10" fill="var(--muted)">same: ignored</text><rect x="514" y="36" width="114" height="46" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="571" y="56" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">close()</text><text x="571" y="72" text-anchor="middle" font-size="10" fill="var(--muted)">isClosed = true</text><rect x="640" y="36" width="114" height="46" rx="9" fill="var(--surface)" stroke="var(--warn)" stroke-width="1.6"/><text x="697" y="56" text-ancho