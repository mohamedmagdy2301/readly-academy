<text x="480" y="53" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">snapshot</text>
<text x="480" y="70" text-anchor="middle" font-size="10" fill="#e8f2fb">release flags fixed</text>
<rect x="595" y="32" width="145" height="50" rx="9" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.4"/>
<text x="667" y="53" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">DI, router, UI</text>
<text x="667" y="70" text-anchor="middle" font-size="10" fill="var(--muted)">isOn(flag)</text>
<line x1="172" y1="57" x2="201" y2="57" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#mk-ink)"/>
<line x1="367" y1="57" x2="396" y2="57" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#mk-ink)"/>
<line x1="562" y1="57" x2="591" y2="57" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#mk-ink)"/>
<rect x="205" y="128" width="160" height="46" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4" stroke-dasharray="6 4"/>
