<text x="480" y="245" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">live flags only</text>
<text x="480" y="262" text-anchor="middle" font-size="10" fill="var(--muted)">snapshot updated</text>
<rect x="595" y="224" width="145" height="50" rx="9" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.4"/>
<text x="667" y="245" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">watch(flag)</text>
<text x="667" y="262" text-anchor="middle" font-size="10" fill="var(--muted)">RecommendationsCubit</text>
<line x1="172" y1="249" x2="201" y2="249" stroke="var(--warn)" stroke-width="1.6" marker-end="url(#mk-warn)"/>
<line x1="367" y1="249" x2="396" y2="249" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#mk-ink)"/>
<line x1="562" y1="249" x2="591" y2="249" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#mk-ink)"/>
