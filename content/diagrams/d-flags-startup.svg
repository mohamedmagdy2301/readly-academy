<text x="285" y="164" text-anchor="middle" font-size="10" fill="var(--muted)">background, not awaited</text>
<line x1="285" y1="84" x2="285" y2="124" stroke="var(--muted)" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#mk-mut)"/>
<rect x="400" y="128" width="160" height="46" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<text x="480" y="148" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">stored on device</text>
<text x="480" y="164" text-anchor="middle" font-size="10" fill="var(--muted)">fetched, not active</text>
<line x1="367" y1="151" x2="396" y2="151" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#mk-mut)"/>
<rect x="595" y="128" width="145" height="46" rx="9" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.4"/>
<text x="667" y="148" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">launch N+1</text>
<text x="667" y="164" text-anchor="middle" font-size="10" fill="var(--muted)">activate() picks it up</text>
<line x1="562" y1="151" x2="591" y2="151" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#mk-acc)"/>
<text x="20" y="214" font-size="11" fill="var(--warn)">kill switch, app open</text>
<rect x="20" y="224" width="150" height="50" rx="9" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.4"/>
<text x="95" y="245" text-anchor="middle" font-size="11" fill="var(--ink)" font-weight="600">console</text>
<text x="95" y="262" text-anchor="middle" font-size="10" fill="var(--muted)">recommendations_enabled=false</text>
