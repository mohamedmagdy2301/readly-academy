<svg viewBox="0 0 760 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="الـ flags عند الـ startup: الـ defaults، وactivate للقيم اللي اتجابت في الفتحة اللي قبلها، وsnapshot، وfetch في الخلفية للفتحة الجاية، والـ realtime للـ live flags بس">
<text x="20" y="22" font-size="11" fill="var(--muted)">launch N (no network on this path)</text>
<rect x="20" y="32" width="150" height="50" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<text x="95" y="53" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">setDefaults</text>
<text x="95" y="70" text-anchor="middle" font-size="10" fill="var(--muted)">Flag.fallback</text>
<rect x="205" y="32" width="160" height="50" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<text x="285" y="53" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">activate()</text>
<text x="285" y="70" text-anchor="middle" font-size="10" fill="var(--muted)">what launch N-1 fetched</text>
