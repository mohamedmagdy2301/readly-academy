<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="الـ app والخلفية قروا نفس الـ refresh token، والسيرفر بيعمل rotation، فالتاني بياخد 401 ويمسح الـ tokens، إلا لو فيه فترة سماح على السيرفر والخلفية مابتمسحش">
<line x1="140" y1="22" x2="742" y2="22" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#mk-mut)"/>
<text x="742" y="40" text-anchor="end" font-size="11" fill="var(--muted)">time</text>

<text x="12" y="84" font-size="12" fill="var(--ink)" font-weight="600">app isolate</text>
<line x1="140" y1="80" x2="742" y2="80" stroke="var(--line)" stroke-dasharray="2 4"/>
<text x="12" y="164" font-size="12" fill="var(--ink)" font-weight="600">secure storage</text>
<line x1="140" y1="160" x2="742" y2="160" stroke="var(--line)" stroke-dasharray="2 4"/>
<text x="12" y="244" font-size="12" fill="var(--ink)" font-weight="600">background isolate</text>
<line x1="140" y1="240" x2="742" y2="240" stroke="var(--line)" stroke-dasharray="2 4"/>

<rect x="150" y="148" width="120" height="24" rx="6" fill="var(--surface)" stroke="var(--ink)"/>
<text x="210" y="164" text-anchor="middle" font-size="11" fill="var(--ink)">refresh = R1</text>
<line x1="230" y1="146" x2="250" y2="96" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#mk-mut)"/>
<text x="258" y="108" font-size="10" fill="var(--muted)">reads R1</text>
<line x1="230" y1="174" x2="270" y2="226" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#mk-mut)"/>
<text x="278" y="214" font-size="10" fill="var(--muted)">reads R1</text>

<rect x="330" y="66" width="150" height="28" rx="6" fill="var(--good-soft)" stroke="var(--good)"/>
<text x="405" y="84" text-anchor="middle" font-size="11" fill="var(--ink)">POST /auth/refresh R1 → R2</text>
<rect x="500" y="148" width="120" height="24" rx="6" fill="var(--surface)" stroke="var(--good)"/>
<text x="560" y="164" text-anchor="middle" font-size="11" fill="var(--ink)">refresh = R2</text>
<line x1="480" y1="92" x2="510" y2="144" stroke="var(--good)" stroke-width="1.4" marker-end="url(#mk-good)"/>

<rect x="380" y="226" width="160" height="28" rx="6" fill="var(--warn-soft)" stroke="var(--warn)"/>
<text x="460" y="244" text-anchor="middle" font-size="11" fill="var(--ink)">POST /auth/refresh R1 → 401</text>
<text x="460" y="272" text-anchor="middle" font-size="10" fill="var(--warn)">R1 was revoked by the rotation</text>

<rect x="580" y="226" width="160" height="28" rx="6" fill="var(--warn)"/>
<text x="660" y="244" text-anchor="middle" font-size="11" fill="#fff">clear() → logged out</text>
<line x1="542" y1="240" x2="576" y2="240" stroke="var(--warn)" stroke-width="1.6" marker-end="url(#mk-warn)"/>

<rect x="140" y="292" width="600" height="30" rx="8" fill="var(--accent-soft)" stroke="var(--accent)"/>
<text x="440" y="312" text-anchor="middle" font-size="11" fill="var(--ink)" class="ar" direction="rtl">الحل: السيرفر يقبل R1 لمدة 60 ثانية ويرجّع نفس R2، والخلفية عمرها ما تعمل clear، واقرا الـ token تاني قبل ما تستسلم</text>
</svg>
