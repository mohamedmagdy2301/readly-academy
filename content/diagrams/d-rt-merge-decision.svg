<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="كل نسخة جاية من السيرفر بتعدّي على نفس الأسئلة: اتمسح بـ version أحدث؟ الصف موجود؟ synced؟ الـ version اللي عندك أصغر؟ وأي لأ معناها الصف يفضل زي ما هو">
<rect x="20" y="20" width="200" height="52" rx="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
<text x="120" y="42" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">server copy, version N</text>
<text x="120" y="60" text-anchor="middle" font-size="10" fill="var(--muted)">event · catch-up · refresh · 409 body</text>

<rect x="270" y="20" width="220" height="52" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
<text x="380" y="50" text-anchor="middle" font-size="12" fill="var(--ink)">removedBooks has version ≥ N?</text>
<line x1="222" y1="46" x2="266" y2="46" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#mk-ink)"/>

<rect x="270" y="110" width="220" height="44" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
<text x="380" y="137" text-anchor="middle" font-size="12" fill="var(--ink)">row exists?</text>
<line x1="380" y1="74" x2="380" y2="106" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#mk-ink)"/>
<text x="388" y="94" font-size="10" fill="var(--muted)">no</text>

<rect x="270" y="192" width="220" height="44" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
<text x="380" y="219" text-anchor="middle" font-size="12" fill="var(--ink)">syncState == 'synced'?</text>
<line x1="380" y1="156" x2="380" y2="188" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#mk-ink)"/>
<text x="388" y="176" font-size="10" fill="var(--muted)">yes</text>

<rect x="270" y="274" width="220" height="44" rx="10" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/>
<text x="380" y="301" text-anchor="middle" font-size="12" fill="var(--ink)">local version &lt; N?</text>
<line x1="380" y1="238" x2="380" y2="270" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#mk-ink)"/>
<text x="388" y="258" font-size="10" fill="var(--muted)">yes</text>

<rect x="560" y="20" width="185" height="52" rx="10" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="652" y="42" text-anchor="middle" font-size="12" fill="var(--ink)">skip</text>
<text x="652" y="60" text-anchor="middle" font-size="10" fill="var(--muted)">late copy of a removed book</text>
<line x1="492" y1="46" x2="556" y2="46" stroke="var(--warn)" stroke-width="1.6" marker-end="url(#mk-warn)"/>
<text x="524" y="40" text-anchor="middle" font-size="10" fill="var(--warn)">yes</text>

<rect x="560" y="110" width="185" height="44" rx="10" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/>
<text x="652" y="137" text-anchor="middle" font-size="12" fill="var(--ink)">insert</text>
<line x1="492" y1="132" x2="556" y2="132" stroke="var(--good)" stroke-width="1.6" marker-end="url(#mk-good)"/>
<text x="524" y="126" text-anchor="middle" font-size="10" fill="var(--good)">no</text>

<rect x="560" y="192" width="185" height="44" rx="10" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="652" y="212" text-anchor="middle" font-size="12" fill="var(--ink)">skip: the edit is yours</text>
<text x="652" y="228" text-anchor="middle" font-size="10" fill="var(--muted)">the queue sends it → 409 → policy</text>
<line x1="492" y1="214" x2="556" y2="214" stroke="var(--warn)" stroke-width="1.6" marker-end="url(#mk-warn)"/>
<text x="524" y="208" text-anchor="middle" font-size="10" fill="var(--warn)">no</text>

<rect x="560" y="274" width="185" height="44" rx="10" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="652" y="294" text-anchor="middle" font-size="12" fill="var(--ink)">skip</text>
<text x="652" y="310" text-anchor="middle" font-size="10" fill="var(--muted)">duplicate or late event</text>
<line x1="492" y1="296" x2="556" y2="296" stroke="var(--warn)" stroke-width="1.6" marker-end="url(#mk-warn)"/>
<text x="524" y="290" text-anchor="middle" font-size="10" fill="var(--warn)">no</text>

<rect x="20" y="274" width="200" height="44" rx="10" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/>
<text x="120" y="301" text-anchor="middle" font-size="12" fill="var(--ink)">overwrite</text>
<line x1="268" y1="296" x2="224" y2="296" stroke="var(--good)" stroke-width="1.6" marker-end="url(#mk-good)"/>
<text x="246" y="290" text-anchor="middle" font-size="10" fill="var(--good)">yes</text>

<text x="380" y="348" text-anchor="middle" font-size="11" fill="var(--ink)" class="ar" direction="rtl">نفس الأسئلة لكل طريق بيكتب نسخة السيرفر في drift</text>
</svg>
