<svg viewBox="0 0 760 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="الاختبارات في الـ CI: على كل PR checks سريعة ثم 3 shards بالتوازي ثم دمج الـ coverage والـ thresholds ثم الـ merge، وكل ليلة ترتيب عشوائي وmutation testing وproperty tests بـ seed جديد"><text x="20" y="20" font-size="11" fill="var(--muted)" font-weight="600">every PR</text><rect x="20" y="60" width="140" height="52" rx="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><text x="90" y="82" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">check</text><text x="90" y="100" text-anchor="middle" font-size="10.5" fill="var(--muted)">format, analyze, arch</text><rect x="210" y="26" width="140" height="34" rx="8" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.4"/><text x="280" y="48" text-anchor="middle" font-size="12" fill="var(--ink)">shard 0</text><rect x="210" y="69" width="140" height="34" rx="8" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.4"/><text x="280" y="91" text-anchor="middle" font-size="12" fill="var(--ink)">shard 1</text><rect x="210" y="112" width="140" height="34" rx="8" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.4"/><text x="280" y="134" text-anchor="middle" font-size="12" fill="var(--ink)">shard 2</text><line x1="162" y1="80" x2="206" y2="45" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#mk-ink)"/><line x1="162" y1="86" x2="206" y2="86" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#mk-ink)"/><line x1="162" y1="92" x2="206" y2="127" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#mk-ink)"/><rect x="400" y="60" width="160" height="52" rx="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><text x="480" y="82" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">coverage</text><text x="480" y="100" text-anchor="middle" font-size="10.5" fill="var(--muted)">merge, clean, thresholds</text><line x1="352" y1="45" x2="396" y2="80" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#mk-ink)"/><line x1="352" y1="86" x2="396" y2="86" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#mk-ink)"/><line x1="352" y1="127" x2="396" y2="92" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#mk-ink)"/><rect x="600" y="60" width="140" height="52" rx="10" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.5"/><text x="670" y="82" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">merge</text><text x="670" y="100" text-anchor="middle" font-size="10.5" fill="#e8f2fb" class="ar" direction="rtl" unicode-bidi="embed">لو كله أخضر بس</text><line x1="562" y1="86" x2="596" y2="86" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#mk-ink)"/><text x="380" y="168" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">بيوقف الـ PR: لازم يبقى سريع وثابت</text><line x1="20" y1="184" x2="740" y2="184" stroke="var(--line)" stroke-width="1.4" stroke-dasharray="6 5"/><text x="20" y="206" font-size="11" fill="var(--muted)" font-weight="600">nightly (schedule)</text><rect x="20" y="216" width="160" height="40" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.4"/><text x="100" y="241" text-anchor="middle" font-size="11.5" fill="var(--ink)">random order x5</text><rect x="200" y="216" width="160" height="40" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.4"/><text x="280" y="241" text-anchor="middle" font-size="11.5" fill="var(--ink)">mutation_test (domain)</text><rect x="380" y="216" width="180" height="40" rx="8" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.4"/><text x="470" y="241" text-anchor="middle" font-size="11.5" fill="var(--ink)">glados, new seed</text><rect x="600" y="216" width="140" height="40" rx="8" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.4"/><text x="670" y="241" text-anchor="middle" font-size="11.5" fill="var(--ink)" class="ar" direction="rtl" unicode-bidi="embed">issue ليه owner</text><line x1="562" y1="236" x2="596" y2="236" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#mk-mut)"/><text x="380" y="284" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">بطيء أو متقلب بطبيعته: بيدوّر على مشاكل، مابيوقفش حد</text></svg>
