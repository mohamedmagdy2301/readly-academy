(#mk-ink)"/><line x1="595" y1="259" x2="626" y2="259" stroke="var(--ink)" stroke-width="1.4" marker-end="url(#mk-ink)"/><text x="380" y="312" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">الـ Bloc بيزوّد خطوتين قبل الـ handler: الـ event كـ object بيتسجّل، والـ transformer اللي بيقرر الـ events تشتغل مع بعض إزاي</text></svg>
