<svg viewBox="0 0 760 326" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="رحلة الـ event في الـ Bloc: الـ UI بتعمل add، والـ event بيعدّي على onEvent والـ transformer والـ handler، والـ emit بيعدّي على onTransition وonChange لحد الـ BlocBuilder. وتحتها رحلة الـ Cubit الأقصر: method ثم emit ثم onChange"><text x="20" y="26" text-anchor="start" font-size="12" fill="var(--muted)" font-weight="600">Bloc</text><rect x="20" y="36" width="110" height="50" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="75" y="58" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">UI</text><text x="75" y="74" text-anchor="middle" font-size="10.5" fill="var(--muted)">add(event)</text><rect x="165" y="36" width="120" height="50" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.5"/><text x="225" y="58" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">events</text><text x="225" y="74" text-anchor="middle" font-size="10.5" fill="var(--muted)">onEvent</text><rect x="320" y="36" width="130" height="50" rx="9" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><text x="385" y="58" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">transformer</text><text x="385" y="74" text-anchor="middle" font-size="10.5" fill="var(--muted)">restartable()</text><rect x="485" y="36" width="130" height="50" rx="9" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><text x="550" y="58" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">on&lt;E&gt; handler</text><text x="550" y="74" text-anchor="middle" font-size="10.5" fill="var(--muted)">await + emit</text><rect x="650" y="36" width="90" height="50" rx="9" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.5"/><text x="695" y="65" text-anchor="middle" font-size="12" fill="#fff" font-weight="600">emit(state)</text><line x1="130" y1="61" x2="161" y2="61" stroke="var(--ink)" stroke-w