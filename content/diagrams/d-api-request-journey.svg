<svg viewBox="0 0 760 445" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="رحلة الطلب من الـ DNS للـ body، والخطأ اللي ممكن يحصل في كل مرحلة، وامتى السيرفر يكون نفّذ الطلب أو مش معروف">
<text x="610" y="22" text-anchor="middle" font-size="11" fill="var(--muted)" font-weight="600">stage</text>
<text x="305" y="22" text-anchor="middle" font-size="11" fill="var(--muted)" font-weight="600">what can fail there</text>
<text x="80" y="22" text-anchor="middle" font-size="11" fill="var(--muted)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">السيرفر استلمه؟</text>
<rect x="20" y="36" width="120" height="148" rx="10" fill="var(--surface)" stroke="var(--good)" stroke-width="1.5"/>
<text x="80" y="106" text-anchor="middle" font-size="12" fill="var(--good)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">لأ، ماوصلوش</text>
<text x="80" y="124" text-anchor="middle" font-size="10" fill="var(--muted)">safe to retry</text>
<rect x="20" y="198" width="120" height="94" rx="10" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="80" y="241" text-anchor="middle" font-size="12" fill="var(--warn)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">مش معروف</text>
<text x="80" y="259" text-anchor="middle" font-size="8.5" fill="var(--muted)">needs Idempotency-Key</text>
<rect x="20" y="306" width="120" height="94" rx="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/>
<text x="80" y="349" text-anchor="middle" font-size="12" fill="var(--accent)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">أيوه، ورد</text>
<text x="80" y="367" text-anchor="middle" font-size="10" fill="var(--muted)">read status + code</text>
<rect x="480" y="36" width="260" height="40" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<text x="610" y="53" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">1. DNS lookup</text>
<text x="610" y="68" text-anchor="middle" font-size="10" fill="var(--muted)">api.readly.app → IP address</text>
<rect x="480" y="90" width="260" height="40" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<text x="610" y="107" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">2. TCP connect</text>
<text x="610" y="122" text-anchor="middle" font-size="10" fill="var(--muted)">open a socket to port 443</text>
<rect x="480" y="144" width="260" height="40" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<text x="610" y="161" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">3. TLS handshake</text>
<text x="610" y="176" text-anchor="middle" font-size="10" fill="var(--muted)">verify the certificate</text>
<rect x="480" y="198" width="260" height="40" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<text x="610" y="215" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">4. send request</text>
<text x="610" y="230" text-anchor="middle" font-size="10" fill="var(--muted)">headers + body</text>
<rect x="480" y="252" width="260" height="40" rx="9" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/>
<text x="610" y="269" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">5. server works, app waits</text>
<text x="610" y="284" text-anchor="middle" font-size="10" fill="var(--muted)">a POST may already be saved here</text>
<rect x="480" y="306" width="260" height="40" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<text x="610" y="323" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">6. status line</text>
<text x="610" y="338" text-anchor="middle" font-size="10" fill="var(--muted)">200 / 4xx / 5xx</text>
<rect x="480" y="360" width="260" height="40" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/>
<text x="610" y="377" text-anchor="middle" font-size="12" fill="var(--ink)" font-weight="600">7. body</text>
<text x="610" y="392" text-anchor="middle" font-size="10" fill="var(--muted)">JSON, hopefully</text>
<line x1="610" y1="77" x2="610" y2="89" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#mk-ink)"/>
<line x1="610" y1="131" x2="610" y2="143" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#mk-ink)"/>
<line x1="610" y1="185" x2="610" y2="197" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#mk-ink)"/>
<line x1="610" y1="239" x2="610" y2="251" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#mk-ink)"/>
<line x1="610" y1="293" x2="610" y2="305" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#mk-ink)"/>
<line x1="610" y1="347" x2="610" y2="359" stroke="var(--ink)" stroke-width="1.5" marker-end="url(#mk-ink)"/>
<rect x="160" y="36" width="290" height="40" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text x="305" y="53" text-anchor="middle" font-size="12" fill="var(--ink)">SocketException: Failed host lookup</text>
<text x="305" y="68" text-anchor="middle" font-size="10" fill="var(--muted)">connectionError · airplane mode, DNS down</text>
<rect x="160" y="90" width="290" height="40" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text x="305" y="107" text-anchor="middle" font-size="11.5" fill="var(--ink)">Connection refused · Network unreachable</text>
<text x="305" y="122" text-anchor="middle" font-size="10" fill="var(--muted)">connectionError / connectionTimeout</text>
<rect x="160" y="144" width="290" height="40" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text x="305" y="161" text-anchor="middle" font-size="12" fill="var(--ink)">HandshakeException</text>
<text x="305" y="176" text-anchor="middle" font-size="10" fill="var(--muted)">wrong device clock, expired cert, proxy</text>
<rect x="160" y="198" width="290" height="40" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text x="305" y="215" text-anchor="middle" font-size="12" fill="var(--ink)">sendTimeout · connection reset</text>
<text x="305" y="230" text-anchor="middle" font-size="10" fill="var(--muted)">big upload on a weak network</text>
<rect x="160" y="252" width="290" height="40" rx="9" fill="var(--surface)" stroke="var(--warn)" stroke-width="1.2"/>
<text x="305" y="269" text-anchor="middle" font-size="12" fill="var(--ink)">receiveTimeout · 504 from a gateway</text>
<text x="305" y="284" text-anchor="middle" font-size="10" fill="var(--muted)">it may have run; you can't tell</text>
<rect x="160" y="306" width="290" height="40" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text x="305" y="323" text-anchor="middle" font-size="12" fill="var(--ink)">badResponse: 4xx / 5xx</text>
<text x="305" y="338" text-anchor="middle" font-size="10" fill="var(--muted)">the server answered: read the body code</text>
<rect x="160" y="360" width="290" height="40" rx="9" fill="var(--surface)" stroke="var(--line)" stroke-width="1.2"/>
<text x="305" y="377" text-anchor="middle" font-size="12" fill="var(--ink)">empty · HTML · wrong shape</text>
<text x="305" y="392" text-anchor="middle" font-size="10" fill="var(--muted)">FormatException / TypeError while parsing</text>
<line x1="478" y1="56" x2="454" y2="56" stroke="var(--warn)" stroke-width="1.5" marker-end="url(#mk-warn)"/>
<line x1="478" y1="110" x2="454" y2="110" stroke="var(--warn)" stroke-width="1.5" marker-end="url(#mk-warn)"/>
<line x1="478" y1="164" x2="454" y2="164" stroke="var(--warn)" stroke-width="1.5" marker-end="url(#mk-warn)"/>
<line x1="478" y1="218" x2="454" y2="218" stroke="var(--warn)" stroke-width="1.5" marker-end="url(#mk-warn)"/>
<line x1="478" y1="272" x2="454" y2="272" stroke="var(--warn)" stroke-width="1.5" marker-end="url(#mk-warn)"/>
<line x1="478" y1="326" x2="454" y2="326" stroke="var(--warn)" stroke-width="1.5" marker-end="url(#mk-warn)"/>
<line x1="478" y1="380" x2="454" y2="380" stroke="var(--warn)" stroke-width="1.5" marker-end="url(#mk-warn)"/>
<text x="380" y="430" text-anchor="middle" font-size="11" fill="var(--muted)">cancel (CancelToken) can cut in at any stage: DioExceptionType.cancel</text>
</svg>
