<svg viewBox="0 0 760 236" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="طبقات حراسة المعمارية: الـ IDE ثم الـ pre-commit ثم الـ CI ثم الـ branch protection"><text x="98" y="34" text-anchor="middle" font-size="11" fill="var(--muted)" font-weight="600">IDE</text><text x="286" y="34" text-anchor="middle" font-size="11" fill="var(--muted)" font-weight="600">pre-commit</text><text x="474" y="34" text-anchor="middle" font-size="11" fill="var(--muted)" font-weight="600">CI</text><text x="662" y="34" text-anchor="middle" font-size="11" fill="var(--muted)" font-weight="600">merge</text><rect x="20" y="44" width="156" height="56" rx="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><text x="98" y="65" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">lints</text><text x="98" y="86" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">وانت بتكتب، في ثانية</text><rect x="208" y="44" width="156" height="56" rx="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="6 4"/><text x="286" y="65" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">format + architecture</text><text x="286" y="86" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">اختياري، وبيتعدّى</text><rect x="396" y="44" width="156" height="56" rx="10" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1.5"/><text x="474" y="65" text-anchor="middle" font-size="13" fill="var(--ink)" font-weight="600">analyze + tests</text><text x="474" y="86" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">كل حاجة، على كل PR</text><rect x="584" y="44" width="156" height="56" rx="10" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.5"/><text x="662" y="65" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">branch protection</text><text x="662" y="86" text-anchor="middle" font-size="11" fill="#e8f2fb" class="ar" direction="rtl" unicode-bidi="embed">الأحمر مايتدمجش</text><line x1="178" y1="72" x2="206" y2="72" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#mk-ink)"/><line x1="366" y1="72" x2="394" y2="72" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#mk-ink)"/><line x1="554" y1="72" x2="582" y2="72" stroke="var(--ink)" stroke-width="1.6" marker-end="url(#mk-ink)"/><text x="98" y="124" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">import لـ src feature تانية</text><text x="98" y="142" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">catch فاضي</text><text x="286" y="124" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">كود مش متنسق</text><text x="286" y="142" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">domain بيعمل import لـ dio</text><text x="474" y="124" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">تست وقع أو coverage نزل</text><text x="474" y="142" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">generated code قديم</text><text x="662" y="124" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">«هدمجه وأصلحه بعدين»</text><line x1="20" y1="164" x2="740" y2="164" stroke="var(--muted)" stroke-width="1.6" marker-end="url(#mk-mut)"/><text x="98" y="182" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">أرخص وأسرع</text><text x="662" y="182" text-anchor="middle" font-size="11" fill="var(--muted)" class="ar" direction="rtl" unicode-bidi="embed">أبطأ، بس محدش يقدر يعدّيه</text><rect x="20" y="192" width="720" height="34" rx="8" fill="var(--good-soft)" stroke="var(--good)" stroke-width="1.5"/><text x="380" y="214" text-anchor="middle" font-size="12" fill="var(--good)" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">نفس القواعد في كل مرحلة: اللي بدري بيوفّر وقت، واللي في الآخر هو الضمان</text></svg>
