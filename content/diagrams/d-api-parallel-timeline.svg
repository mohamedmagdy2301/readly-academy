<svg viewBox="0 0 760 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="الـ work والـ author ورا بعض، والـ work والـ notes مع بعض، وفشل الـ author بيخفي سطر واحد بس من الصفحة">
