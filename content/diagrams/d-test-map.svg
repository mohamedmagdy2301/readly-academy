<svg viewBox="0 0 760 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="خريطة أنواع الاختبارات: حسب الحجم، وحسب اللي بيتشيك عليه، وحسب امتى وليه، واختبار التستات نفسها، والـ black box والـ white box بيقطعوا الكل"><rect x="20" y="16" width="165" height="46" rx="10" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.5"/><text x="102.5" y="36" text-anchor="middle" font-size="13" fill="#fff" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">الحجم</text><text x="102.5" y="53" text-anchor="middle" font-size="10.5" fill="#e8f2fb">scope</text><rect x="20" y="78" width="165" height="40" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/><text x="102.5" y="95" text-anchor="middle" font-size="12.5" fill="var(--ink)" font-weight="600">unit</text><text x="102.5" y="110" text-anchor="middle" font-size="10.5" fill="var(--muted)">one function / class</text><line x1="102.5" y1="119" x2="102.5" y2="130" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#mk-mut)"/><rect x="20" y="132" width="165" height="40" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/><text x="102.5" y="149" text-anchor="middle" font-size="12.5" fill="var(--ink)" font-weight="600">widget</text><text x="102.5" y="164" text-anchor="middle" font-size="10.5" fill="var(--muted)">one screen, no device</text><line x1="102.5" y1="173" x2="102.5" y2="184" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#mk-mut)"/><rect x="20" y="186" width="165" height="40" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/><text x="102.5" y="203" text-anchor="middle" font-size="12.5" fill="var(--ink)" font-weight="600">integration</text><text x="102.5" y="218" text-anchor="middle" font-size="10.5" fill="var(--muted)">the app on a device</text><line x1="102.5" y1="227" x2="102.5" y2="238" stroke="var(--muted)" stroke-width="1.4" marker-end="url(#mk-mut)"/><rect x="20" y="240" width="165" height="40" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/><text x="102.5" y="257" text-anchor="middle" font-size="12.5" fill="var(--ink)" font-weight="600">e2e</text><text x="102.5" y="272" text-anchor="middle" font-size="10.5" fill="var(--muted)">app + real backend</text><rect x="205" y="16" width="165" height="46" rx="10" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.5"/><text x="287.5" y="36" text-anchor="middle" font-size="13" fill="#fff" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">بيتشيك على إيه</text><text x="287.5" y="53" text-anchor="middle" font-size="10.5" fill="#e8f2fb">what is checked</text><rect x="205" y="78" width="165" height="40" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/><text x="287.5" y="95" text-anchor="middle" font-size="12.5" fill="var(--ink)" font-weight="600">golden</text><text x="287.5" y="110" text-anchor="middle" font-size="10.5" fill="var(--muted)">pixels vs a reference</text><rect x="205" y="132" width="165" height="40" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/><text x="287.5" y="149" text-anchor="middle" font-size="12.5" fill="var(--ink)" font-weight="600">contract</text><text x="287.5" y="164" text-anchor="middle" font-size="10.5" fill="var(--muted)">fake == real behavior</text><rect x="205" y="186" width="165" height="40" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/><text x="287.5" y="203" text-anchor="middle" font-size="12.5" fill="var(--ink)" font-weight="600">performance</text><text x="287.5" y="218" text-anchor="middle" font-size="10.5" fill="var(--muted)">frames, time, memory</text><rect x="205" y="240" width="165" height="40" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/><text x="287.5" y="257" text-anchor="middle" font-size="12.5" fill="var(--ink)" font-weight="600">acceptance</text><text x="287.5" y="272" text-anchor="middle" font-size="10.5" fill="var(--muted)">the product requirement</text><rect x="390" y="16" width="165" height="46" rx="10" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.5"/><text x="472.5" y="36" text-anchor="middle" font-size="13" fill="#fff" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">امتى وليه</text><text x="472.5" y="53" text-anchor="middle" font-size="10.5" fill="#e8f2fb">when / why</text><rect x="390" y="78" width="165" height="40" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/><text x="472.5" y="95" text-anchor="middle" font-size="12.5" fill="var(--ink)" font-weight="600">regression</text><text x="472.5" y="110" text-anchor="middle" font-size="10.5" fill="var(--muted)">an old bug came back?</text><rect x="390" y="132" width="165" height="40" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/><text x="472.5" y="149" text-anchor="middle" font-size="12.5" fill="var(--ink)" font-weight="600">smoke</text><text x="472.5" y="164" text-anchor="middle" font-size="10.5" fill="var(--muted)">does it even start?</text><rect x="575" y="16" width="165" height="46" rx="10" fill="var(--accent)" stroke="var(--accent)" stroke-width="1.5"/><text x="657.5" y="36" text-anchor="middle" font-size="13" fill="#fff" font-weight="600" class="ar" direction="rtl" unicode-bidi="embed">اختبار التستات</text><text x="657.5" y="53" text-anchor="middle" font-size="10.5" fill="#e8f2fb">testing the tests</text><rect x="575" y="78" width="165" height="40" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/><text x="657.5" y="95" text-anchor="middle" font-size="12.5" fill="var(--ink)" font-weight="600">mutation</text><text x="657.5" y="110" text-anchor="middle" font-size="10.5" fill="var(--muted)">do tests catch a change?</text><rect x="575" y="132" width="165" height="40" rx="8" fill="var(--surface)" stroke="var(--line)" stroke-width="1.4"/><text x="657.5" y="149" text-anchor="middle" font-size="12.5" fill="var(--ink)" font-weight="600">property-based</text><text x="657.5" y="164" text-anchor="middle" font-size="10.5" fill="var(--muted)">random inputs, a rule</text><text x="102.5" y="300" text-anchor="middle" font-size="10.5" fill="var(--warn)">wider = slower + costlier</text><rect x="20" y="318" width="720" height="46" rx="10" fill="var(--warn-soft)" stroke="var(--warn)" stroke-width="1.5"/><text x="40" y="346" text-anchor="start" font-size="12.5" fill="var(--ink)" font-weight="600">black box</text><text x="720" y="346" text-anchor="end" font-size="12.5" fill="var(--ink)" font-weight="600">white box</text><line x1="120" y1="341" x2="630" y2="341" stroke="var(--warn)" stroke-width="1.4" marker-end="url(#mk-warn)"/><text x="380" y="334" text-anchor="middle" font-size="11" fill="var(--ink)" class="ar" direction="rtl" unicode-bidi="embed">بيقطع كل الأنواع: التست عارف قد إيه عن الكود من جوه؟</text><text x="380" y="356" text-anchor="middle" font-size="10.5" fill="var(--muted)">inputs and outputs only ... reads the branches inside</text></svg>